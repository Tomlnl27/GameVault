<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 18px;
    background: #111118;
    border-bottom: 1px solid #24242d;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

.subtitle {
    color: #888894;
    margin-top: 5px;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search input {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #30303a;
    background: #17171f;
    color: white;
    font-size: 16px;
}

.search button {
    padding: 14px 18px;
    border: 0;
    border-radius: 12px;
    background: #ffffff;
    color: #000;
    font-weight: 700;
}

.status {
    color: #8f8f9b;
    margin-bottom: 18px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
}

.card {
    background: #15151c;
    border: 1px solid #24242d;
    border-radius: 14px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.card-content {
    padding: 12px;
}

.card h3 {
    margin: 0 0 8px;
    font-size: 16px;
}

.date {
    color: #8d8d99;
    font-size: 13px;
}

.empty {
    color: #777783;
    text-align: center;
    padding: 50px 10px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 GameVault</div>
    <div class="subtitle">Ta bibliothèque gaming</div>
</header>

<main>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Rechercher un jeu..."
        >
        <button onclick="searchGames()">Rechercher</button>
    </div>

    <div id="status" class="status">
        Prêt à rechercher.
    </div>

    <div id="games" class="games">
        <div class="empty">
            Recherche ton premier jeu 🎮
        </div>
    </div>

</main>

<script>

const WORKER_URL = "https://gamevault-api.tom-lunel27200.workers.dev";

async function searchGames() {

    const input = document.getElementById("searchInput");
    const gamesContainer = document.getElementById("games");
    const status = document.getElementById("status");

    const query = input.value.trim();

    if (!query) {
        status.textContent = "Écris le nom d'un jeu.";
        return;
    }

    status.textContent = "Recherche en cours...";
    gamesContainer.innerHTML = "";

    try {

        const response = await fetch(
            WORKER_URL + "/search?q=" + encodeURIComponent(query)
        );

        if (!response.ok) {
            throw new Error("Erreur serveur");
        }

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
            gamesContainer.innerHTML =
                '<div class="empty">Aucun jeu trouvé.</div>';

            status.textContent = "Aucun résultat.";
            return;
        }

        status.textContent =
            data.results.length + " résultat(s) trouvé(s).";

        data.results.forEach(game => {

            const card = document.createElement("div");
            card.className = "card";

            const image =
                game.background_image ||
                "https://via.placeholder.com/300x450?text=No+Image";

            card.innerHTML = `
                <img src="${image}" alt="">
                <div class="card-content">
                    <h3>${escapeHtml(game.name || "Jeu sans nom")}</h3>
                    <div class="date">
                        ${game.released || "Date inconnue"}
                    </div>
                </div>
            `;

            gamesContainer.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        status.textContent =
            "Impossible de contacter le serveur.";

        gamesContainer.innerHTML = `
            <div class="empty">
                Vérifie que ton Worker Cloudflare fonctionne.
            </div>
        `;
    }
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchGames();
        }

    });

</script>

</body>
</html>
