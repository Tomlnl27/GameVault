<script>

const WORKER_URL =
    "https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;

let library =
    JSON.parse(
        localStorage.getItem(
            "gamevault_library"
        )
    ) || [];


/* ============================= */
/* RECHERCHE */
/* ============================= */

async function searchGames() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const gamesContainer =
        document.getElementById(
            "games"
        );

    const status =
        document.getElementById(
            "status"
        );

    const query =
        input.value.trim();

    if (!query) {

        status.textContent =
            "Écris le nom d'un jeu.";

        return;

    }

    status.textContent =
        "Recherche en cours...";

    gamesContainer.innerHTML = "";

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/search?q=" +
                encodeURIComponent(query)
            );

        if (!response.ok) {

            throw new Error(
                "Erreur serveur"
            );

        }

        const data =
            await response.json();

        if (
            !data.results ||
            data.results.length === 0
        ) {

            gamesContainer.innerHTML =
                '<div class="empty">Aucun jeu trouvé.</div>';

            status.textContent =
                "Aucun résultat.";

            return;

        }

        status.textContent =
            data.results.length +
            " résultat(s) trouvé(s).";

        data.results.forEach(
            game => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";

                const image =
                    game.background_image ||
                    "https://via.placeholder.com/300x450?text=No+Image";

                card.innerHTML = `

                    <img
                        src="${image}"
                        alt=""
                    >

                    <div class="card-content">

                        <h3>
                            ${escapeHtml(
                                game.name ||
                                "Jeu sans nom"
                            )}
                        </h3>

                        <div class="date">
                            ${
                                game.released ||
                                "Date inconnue"
                            }
                        </div>

                    </div>

                `;

                card.onclick =
                    () => openGame(game);

                gamesContainer.appendChild(
                    card
                );

            }
        );

    } catch (error) {

        console.error(error);

        status.textContent =
            "Impossible de contacter le serveur.";

        gamesContainer.innerHTML = `
            <div class="empty">
                Erreur lors de la recherche.
            </div>
        `;

    }

}


/* ============================= */
/* FICHE */
/* ============================= */

async function openGame(game) {

    currentGame = game;

    hideAllSections();

    document
        .getElementById(
            "detailSection"
        )
        .classList.remove(
            "hidden"
        );

    renderDetail();

}


async function renderDetail() {

    if (!currentGame) return;

    const detail =
        document.getElementById(
            "detail"
        );

    detail.innerHTML = `
        <div class="empty">
            Chargement des informations du jeu...
        </div>
    `;

    let freshGame =
        currentGame;


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/game/" +
                currentGame.id
            );

        if (response.ok) {

            const data =
                await response.json();

            freshGame = {
                ...currentGame,
                ...data
            };

            currentGame =
                freshGame;

        }

    } catch (error) {

        console.log(
            "Informations détaillées indisponibles"
        );

    }


    const savedGame =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );


    const image =
        currentGame.background_image ||
        "https://via.placeholder.com/300x450?text=No+Image";


    const platforms =
        currentGame.platforms
        ?
        currentGame.platforms
            .map(
                p =>
                    p.platform
                    ?
                    p.platform.name
                    :
                    p.name
            )
            .join(", ")
        :
        "Inconnues";


    const genres =
        currentGame.genres
        ?
        currentGame.genres
            .map(
                g =>
                    g.name ||
                    g
            )
            .join(", ")
        :
        "Inconnus";


    const developers =
        currentGame.developers
        ?
        currentGame.developers
            .map(
                d =>
                    d.name ||
                    d
            )
            .join(", ")
        :
        "Inconnu";


    const publishers =
        currentGame.publishers
        ?
        currentGame.publishers
            .map(
                p =>
                    p.name ||
                    p
            )
            .join(", ")
        :
        "Inconnu";


    const description =
        currentGame.description_raw ||
        currentGame.description ||
        "Aucune description disponible pour ce jeu.";


    const personalRating =
        savedGame
        ?
        savedGame.note
        :
        0;


    const playHours =
        savedGame
        ?
        savedGame.hours
        :
        0;


    const playMinutes =
        savedGame
        ?
        savedGame.minutes
        :
        0;


    const progress =
        savedGame
        ?
        savedGame.progress
        :
        0;


    const status =
        savedGame
        ?
        savedGame.status
        :
        "À jouer";


    detail.innerHTML = `

        <div class="hero">

            <img
                class="detail-cover"
                src="${image}"
                alt=""
            >

            <div>

                <h1 class="detail-title">

                    ${escapeHtml(
                        currentGame.name ||
                        "Jeu"
                    )}

                </h1>


                <div class="release">

                    📅
                    ${
                        currentGame.released ||
                        "Date de sortie inconnue"
                    }

                </div>


                <div class="description">

                    ${escapeHtml(
                        stripHtml(
                            description
                        )
                    )}

                </div>


                <div class="meta-grid">

                    <div class="meta">

                        <div class="meta-label">
                            🎮 Plateformes
                        </div>

                        <div class="meta-value">
                            ${escapeHtml(
                                platforms
                            )}
                        </div>

                    </div>


                    <div class="meta">

                        <div class="meta-label">
                            🎭 Genres
                        </div>

                        <div class="meta-value">
                            ${escapeHtml(
                                genres
                            )}
                        </div>

                    </div>


                    <div class="meta">

                        <div class="meta-label">
                            🛠️ Développeur
                        </div>

                        <div class="meta-value">
                            ${escapeHtml(
                                developers
                            )}
                        </div>

                    </div>


                    <div class="meta">

                        <div class="meta-label">
                            🏢 Éditeur
                        </div>

                        <div class="meta-value">
                            ${escapeHtml(
                                publishers
                            )}
                        </div>

                    </div>


                    <div class="meta">

                        <div class="meta-label">
                            ⭐ Note RAWG
                        </div>

                        <div class="meta-value">

                            ${
                                currentGame.rating
                                ?
                                currentGame.rating +
                                " / 5"
                                :
                                "N/A"
                            }

                        </div>

                    </div>


                    <div class="meta">

                        <div class="meta-label">
                            👥 Avis
                        </div>

                        <div class="meta-value">

                            ${
                                currentGame.ratings_count
                                ?
                                currentGame.ratings_count
                                :
                                "N/A"
                            }

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                ⭐ Ma note
            </div>

            <div class="rating-value">

                <span id="ratingValue">
                    ${personalRating}
                </span>

                / 10

            </div>


            <div class="rating-controls">

                <button
                    id="minusRating"
                    onclick="changeRating(-0.5)">

                    −

                </button>


                <span>
                    Par 0,5
                </span>


                <button
                    id="plusRating"
                    onclick="changeRating(0.5)">

                    +

                </button>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                🕐 Temps de jeu
            </div>

            <div class="playtime">

                <input
                    id="hoursInput"
                    type="number"
                    min="0"
                    value="${playHours}"
                    placeholder="Heures"
                >

                <input
                    id="minutesInput"
                    type="number"
                    min="0"
                    max="59"
                    value="${playMinutes}"
                    placeholder="Minutes"
                >

            </div>


            <button
                class="save-button"
                onclick="savePlaytime()">

                💾 Enregistrer

            </button>

        </div>


        <div class="panel">

            <div class="panel-title">
                📊 Progression
            </div>


            <div class="progress-value">

                <span id="progressValue">
                    ${progress}
                </span>%

            </div>


            <input
                id="progressSlider"
                class="progress-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="${progress}"
                oninput="updateProgress(this.value)"
            >

        </div>


        <div class="panel">

            <div class="panel-title">
                🎮 Statut
            </div>


            <select
                onchange="changeStatus(
                    ${currentGame.id},
                    this.value
                )">

                <option
                    value="À jouer"
                    ${
                        status ===
                        "À jouer"
                        ?
                        "selected"
                        :
                        ""
                    }>

                    À jouer

                </option>


                <option
                    value="En cours"
                    ${
                        status ===
                        "En cours"
                        ?
                        "selected"
                        :
                        ""
                    }>

                    En cours

                </option>


                <option
                    value="Terminé"
                    ${
                        status ===
                        "Terminé"
                        ?
                        "selected"
                        :
                        ""
                    }>

                    Terminé

                </option>

            </select>

        </div>


        <div class="actions">

            ${
                savedGame
                ?

                `<button class="add">

                    ✅ Dans ma bibliothèque

                </button>`

                :

                `<button
                    class="add"
                    onclick="addToLibrary()">

                    ➕ Ajouter à ma bibliothèque

                </button>`

            }


            ${
                savedGame
                ?

                `<button
                    class="delete"
                    onclick="deleteGame(
                        ${currentGame.id}
                    )">

                    🗑️ Supprimer

                </button>`

                :

                ""

            }

        </div>

    `;


    updateRatingButtons();

}


/* ============================= */
/* BIBLIOTHÈQUE */
/* ============================= */

function ensureGameInLibrary() {

    if (!currentGame) return null;


    let game =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );


    if (!game) {

        game = {

            id:
                currentGame.id,

            name:
                currentGame.name,

            background_image:
                currentGame.background_image,

            released:
                currentGame.released,

            status:
                "À jouer",

            note:
                0,

            progress:
                0,

            hours:
                0,

            minutes:
                0,

            addedAt:
                Date.now()

        };


        library.push(
            game
        );


        saveLibrary();

    }


    return game;

}


function addToLibrary() {

    ensureGameInLibrary();

    renderDetail();

}


function changeRating(amount) {

    const game =
        ensureGameInLibrary();

    if (!game) return;


    let newRating =
        Number(game.note || 0) +
        amount;


    newRating =
        Math.round(
            newRating * 2
        ) / 2;


    newRating =
        Math.max(
            0,
            Math.min(
                10,
                newRating
            )
        );


    game.note =
        newRating;


    saveLibrary();

    renderDetail();

}


function updateRatingButtons() {

    const game =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );


    if (!game) return;


    const minus =
        document.getElementById(
            "minusRating"
        );


    const plus =
        document.getElementById(
            "plusRating"
        );


    if (minus) {

        minus.disabled =
            game.note <= 0;

    }


    if (plus) {

        plus.disabled =
            game.note >= 10;

    }

}


function savePlaytime() {

    const game =
        ensureGameInLibrary();

    if (!game) return;


    let hours =
        Number(
            document.getElementById(
                "hoursInput"
            ).value
        );


    let minutes =
        Number(
            document.getElementById(
                "minutesInput"
            ).value
        );


    if (
        isNaN(hours) ||
        hours < 0
    ) {

        hours = 0;

    }


    if (
        isNaN(minutes) ||
        minutes < 0
    ) {

        minutes = 0;

    }


    hours =
        Math.floor(
            hours
        );


    minutes =
        Math.floor(
            minutes
        );


    hours +=
        Math.floor(
            minutes / 60
        );


    minutes =
        minutes % 60;


    game.hours =
        hours;


    game.minutes =
        minutes;


    saveLibrary();

    renderDetail();

}


function updateProgress(value) {

    const game =
        ensureGameInLibrary();

    if (!game) return;


    game.progress =
        Number(value);


    const display =
        document.getElementById(
            "progressValue"
        );


    if (display) {

        display.textContent =
            value;

    }


    saveLibrary();

}


function changeStatus(
    id,
    status
) {

    let game =
        library.find(
            item =>
                item.id === id
        );


    if (!game) {

        game =
            ensureGameInLibrary();

    }


    if (!game) return;


    game.status =
        status;


    saveLibrary();

    renderDetail();

}


function deleteGame(id) {

    const game =
        library.find(
            item =>
                item.id === id
        );


    if (!game) return;


    const confirmed =
        confirm(
            `Supprimer "${game.name}" de ta bibliothèque ?`
        );


    if (!confirmed) return;


    library =
        library.filter(
            item =>
                item.id !== id
        );


    saveLibrary();

    showLibrary();

}


function saveLibrary() {

    localStorage.setItem(
        "gamevault_library",
        JSON.stringify(
            library
        )
    );

}

/* RENDU BIBLIOTHÈQUE */
/* ============================= */

function renderLibrary() {

    const container =
        document.getElementById(
            "library"
        );


    const searchInput =
        document.getElementById(
            "librarySearch"
        );


    const statusFilter =
        document.getElementById(
            "statusFilter"
        );


    const sortFilter =
        document.getElementById(
            "sortFilter"
        );


    const query =
        searchInput
        ?
        searchInput.value
            .trim()
            .toLowerCase()
        :
        "";


    const selectedStatus =
        statusFilter
        ?
        statusFilter.value
        :
        "Tous";


    const selectedSort =
        sortFilter
        ?
        sortFilter.value
        :
        "recent";


    let filtered =
        library.filter(
            game => {

                const matchesName =
                    game.name
                        .toLowerCase()
                        .includes(
                            query
                        );


                const matchesStatus =
                    selectedStatus ===
                    "Tous" ||
                    game.status ===
                    selectedStatus;


                return (
                    matchesName &&
                    matchesStatus
                );

            }
        );


    filtered.sort(
        (a, b) => {

            if (
                selectedSort ===
                "name"
            ) {

                return a.name.localeCompare(
                    b.name
                );

            }


            if (
                selectedSort ===
                "rating"
            ) {

                return (
                    (b.note || 0) -
                    (a.note || 0)
                );

            }


            if (
                selectedSort ===
                "progress"
            ) {

                return (
                    (b.progress || 0) -
                    (a.progress || 0)
                );

            }


            if (
                selectedSort ===
                "time"
            ) {

                const timeA =
                    (a.hours || 0) * 60 +
                    (a.minutes || 0);


                const timeB =
                    (b.hours || 0) * 60 +
                    (b.minutes || 0);


                return timeB - timeA;

            }


            return (
                (b.addedAt || 0) -
                (a.addedAt || 0)
            );

        }
    );


    const count =
        document.getElementById(
            "libraryCount"
        );


    if (count) {

        count.textContent =
            `${filtered.length} jeu(x) affiché(s) sur ${library.length}`;

    }


    if (
        filtered.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">Aucun jeu ne correspond à ta recherche.</div>';

        return;

    }


    container.innerHTML = "";


    filtered.forEach(
        game => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "library-item";


            const image =
                game.background_image ||
                "https://via.placeholder.com/100x150?text=No+Image";


            const playtime =
                game.hours > 0 ||
                game.minutes > 0
                ?
                `${game.hours} h ${game.minutes} min`
                :
                "Aucun temps enregistré";


            item.innerHTML = `

                <img
                    src="${image}"
                    alt=""
                >


                <div class="library-info">

                    <strong>
                        ${escapeHtml(
                            game.name
                        )}
                    </strong>


                    <br>


                    <small>
                        ${
                            game.released ||
                            ""
                        }
                    </small>


                    <div class="library-rating">

                        ⭐
                        ${
                            game.note > 0
                            ?
                            game.note +
                            " / 10"
                            :
                            "Pas encore noté"
                        }

                    </div>


                    <div class="library-progress">

                        📊
                        ${
                            game.progress ||
                            0
                        }%

                    </div>


                    <div class="library-time">

                        🕐
                        ${playtime}

                    </div>


                    <div class="status-badge">

                        ${escapeHtml(
                            game.status ||
                            "À jouer"
                        )}

                    </div>

                </div>

            `;


            item.onclick =
                () => openSavedGame(
                    game
                );


            container.appendChild(
                item
            );

        }
    );

}


async function openSavedGame(game) {

    currentGame =
        game;


    hideAllSections();


    document
        .getElementById(
            "detailSection"
        )
        .classList.remove(
            "hidden"
        );


    renderDetail();

}

/* STATISTIQUES */
/* ============================= */

function renderStats() {

    const container =
        document.getElementById(
            "statsContent"
        );


    const total =
        library.length;


    const completed =
        library.filter(
            game =>
                game.status ===
                "Terminé"
        ).length;


    const inProgress =
        library.filter(
            game =>
                game.status ===
                "En cours"
        ).length;


    const toPlay =
        library.filter(
            game =>
                game.status ===
                "À jouer"
        ).length;


    const ratedGames =
        library.filter(
            game =>
                Number(game.note) > 0
        );


    const averageRating =
        ratedGames.length
        ?
        (
            ratedGames.reduce(
                (sum, game) =>
                    sum +
                    Number(game.note),
                0
            ) /
            ratedGames.length
        ).toFixed(1)
        :
        "—";


    const totalMinutes =
        library.reduce(
            (sum, game) =>
                sum +
                Number(game.hours || 0) * 60 +
                Number(game.minutes || 0),
            0
        );


    const totalHours =
        Math.floor(
            totalMinutes / 60
        );


    const averageProgress =
        total
        ?
        Math.round(
            library.reduce(
                (sum, game) =>
                    sum +
                    Number(
                        game.progress || 0
                    ),
                0
            ) / total
        )
        :
        0;


    const completionRate =
        total
        ?
        Math.round(
            completed /
            total *
            100
        )
        :
        0;


    const bestRated =
        ratedGames.length
        ?
        [...ratedGames].sort(
            (a, b) =>
                b.note -
                a.note
        )[0]
        :
        null;


    const mostPlayed =
        library.length
        ?
        [...library].sort(
            (a, b) => {

                const aTime =
                    (a.hours || 0) * 60 +
                    (a.minutes || 0);


                const bTime =
                    (b.hours || 0) * 60 +
                    (b.minutes || 0);


                return bTime - aTime;

            }
        )[0]
        :
        null;


    container.innerHTML = `

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    🎮
                </div>

                <div class="stat-number">
                    ${total}
                </div>

                <div class="stat-label">
                    Jeux
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🏆
                </div>

                <div class="stat-number">
                    ${completed}
                </div>

                <div class="stat-label">
                    Terminés
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⭐
                </div>

                <div class="stat-number">
                    ${averageRating}
                </div>

                <div class="stat-label">
                    Note moyenne
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🕐
                </div>

                <div class="stat-number">
                    ${totalHours}h
                </div>

                <div class="stat-label">
                    Temps total
                </div>

            </div>

        </div>


        <div class="stats-section">

            <h3>
                📊 Progression moyenne
            </h3>


            <div class="big-stat">
                ${averageProgress}%
            </div>


            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${averageProgress}%">
                </div>

            </div>


            <div class="small-text">

                ${completionRate}%
                de ta bibliothèque est terminée.

            </div>

        </div>


        <div class="stats-section">

            <h3>
                🎮 Répartition
            </h3>


            <div>

                📌 À jouer :
                <strong>
                    ${toPlay}
                </strong>

            </div>


            <br>


            <div>

                🎮 En cours :
                <strong>
                    ${inProgress}
                </strong>

            </div>


            <br>


            <div>

                🏆 Terminés :
                <strong>
                    ${completed}
                </strong>

            </div>

        </div>


        ${
            bestRated
            ?

            `

            <div class="stats-section">

                <h3>
                    ⭐ Jeu le mieux noté
                </h3>


                <div class="best-game">

                    <img
                        src="${
                            bestRated.background_image
                        }"
                        alt=""
                    >


                    <div>

                        <strong>
                            ${escapeHtml(
                                bestRated.name
                            )}
                        </strong>


                        <div class="big-stat">

                            ${bestRated.note}
                            / 10

                        </div>

                    </div>

                </div>

            </div>

            `

            :

            ""

        }


        ${
            mostPlayed &&
            (
                mostPlayed.hours > 0 ||
                mostPlayed.minutes > 0
            )

            ?

            `

            <div class="stats-section">

                <h3>
                    🕐 Jeu le plus joué
                </h3>


                <div class="best-game">

                    <img
                        src="${
                            mostPlayed.background_image
                        }"
                        alt=""
                    >


                    <div>

                        <strong>
                            ${escapeHtml(
                                mostPlayed.name
                            )}
                        </strong>


                        <div class="big-stat">

                            ${
                                mostPlayed.hours ||
                                0
                            }
                            h

                            ${
                                mostPlayed.minutes ||
                                0
                            }
                            min

                        </div>

                    </div>

                </div>

            </div>

            `

            :

            ""

        }

    `;

}

/* UTILITAIRES */
/* ============================= */

function stripHtml(
    html
) {

    const temp =
        document.createElement(
            "div"
        );


    temp.innerHTML =
        html;


    return temp.textContent ||
        temp.innerText ||
        "";

}


function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
