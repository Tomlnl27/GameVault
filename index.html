<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#09090d;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

header{
padding:22px 18px 18px;
background:#101016;
border-bottom:1px solid #24242d
}

.logo{
font-size:29px;
font-weight:900;
letter-spacing:-1px
}

.subtitle{
color:#858590;
font-size:14px;
margin-top:4px
}

nav{
display:flex;
gap:8px;
padding:12px 16px;
background:#101016;
border-bottom:1px solid #20202a;
overflow-x:auto
}

nav button{
border:1px solid #2b2b35;
background:#191920;
color:#ddd;
padding:10px 14px;
border-radius:10px;
white-space:nowrap;
font-weight:700;
cursor:pointer
}

nav button.active{
background:#fff;
color:#000
}

main{
max-width:1100px;
margin:auto;
padding:20px
}

.hidden{
display:none!important
}

.search{
display:flex;
gap:10px;
margin-bottom:18px
}

.search input{
flex:1;
min-width:0;
background:#15151c;
color:#fff;
border:1px solid #30303a;
border-radius:12px;
padding:14px;
font-size:16px;
outline:none
}

.search button{
border:0;
background:#fff;
color:#000;
border-radius:12px;
padding:0 18px;
font-weight:800;
cursor:pointer
}

.status{
color:#858590;
font-size:14px;
margin-bottom:18px
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:16px
}

.card{
background:#14141b;
border:1px solid #25252f;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.15s
}

.card:hover{
transform:translateY(-3px);
border-color:#444451
}

.card img{
display:block;
width:100%;
height:225px;
object-fit:cover
}

.card-content{
padding:12px
}

.card-title{
font-weight:800;
line-height:1.25
}

.card-date{
font-size:12px;
color:#777783;
margin-top:6px
}

.empty{
text-align:center;
color:#777783;
padding:50px 15px
}

/* =========================
   DETAIL JEU
========================= */

.back{
border:0;
background:#20202a;
color:#fff;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:700
}

.detail{
margin-top:18px;
background:#14141b;
border:1px solid #292933;
border-radius:18px;
overflow:hidden
}

.detail-top{
display:grid;
grid-template-columns:300px 1fr;
gap:25px;
padding:20px
}

.cover{
width:100%;
max-height:460px;
object-fit:cover;
border-radius:13px
}

.detail-title{
font-size:35px;
line-height:1.05;
margin:5px 0 8px
}

.release{
color:#858590;
font-size:14px;
margin-bottom:18px
}

.description{
color:#c9c9d0;
line-height:1.65;
font-size:15px
}

.meta{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px
}

.meta-box{
background:#0d0d12;
border:1px solid #292933;
border-radius:11px;
padding:12px
}

.meta-label{
font-size:11px;
color:#777783;
margin-bottom:5px
}

.meta-value{
font-size:14px;
font-weight:700
}

/* =========================
   STUDIO BUTTONS
========================= */

.studio-link{
display:inline-block;
background:#20202a;
color:#fff;
border:1px solid #353540;
padding:7px 10px;
border-radius:8px;
font-weight:800;
cursor:pointer;
transition:.15s
}

.studio-link:hover{
background:#2b2b36;
border-color:#555563;
transform:translateY(-1px)
}

.studio-links{
display:flex;
flex-wrap:wrap;
gap:6px
}

/* =========================
   PANELS
========================= */

.panel{
margin:0 20px 15px;
padding:16px;
background:#0d0d12;
border:1px solid #292933;
border-radius:13px
}

.panel-title{
font-weight:800;
margin-bottom:12px
}

.rating{
font-size:30px;
font-weight:900;
margin-bottom:12px
}

.rating-controls{
display:flex;
align-items:center;
gap:12px
}

.rating-controls button{
width:43px;
height:43px;
border-radius:10px;
border:1px solid #34343f;
background:#20202a;
color:#fff;
font-size:23px;
cursor:pointer
}

.rating-controls button:disabled{
opacity:.3
}

select{
background:#1b1b23;
color:#fff;
border:1px solid #353540;
border-radius:9px;
padding:10px;
outline:none
}

.slider{
width:100%;
margin-top:8px
}

.progress-number{
font-size:24px;
font-weight:900
}

.time-inputs{
display:flex;
gap:8px;
flex-wrap:wrap
}

.time-inputs input{
width:100px;
padding:10px;
background:#1b1b23;
color:#fff;
border:1px solid #353540;
border-radius:9px
}

.action{
margin:0 20px 20px;
display:flex;
gap:10px;
flex-wrap:wrap
}

.action button{
padding:12px 15px;
border-radius:10px;
border:0;
font-weight:800;
cursor:pointer
}

.add{
background:#fff;
color:#000
}

.delete{
background:#2a171a;
color:#ff929b
}

.in-library{
background:#20202a!important;
color:#fff!important;
cursor:default!important
}

/* =========================
   SERIES
========================= */

.series-panel{
margin:0 20px 15px;
padding:16px;
background:#0d0d12;
border:1px solid #292933;
border-radius:13px
}

.series-title{
font-size:18px;
font-weight:900;
margin-bottom:13px
}

.series-list{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:6px;
scrollbar-width:thin
}

.series-card{
flex:0 0 135px;
background:#15151c;
border:1px solid #292933;
border-radius:11px;
overflow:hidden;
cursor:pointer;
transition:.15s
}

.series-card:hover{
transform:translateY(-3px);
border-color:#555563
}

.series-card img{
display:block;
width:100%;
height:185px;
object-fit:cover
}

.series-card-body{
padding:9px
}

.series-card-name{
font-size:13px;
font-weight:800;
line-height:1.25
}

.series-card-date{
font-size:11px;
color:#777783;
margin-top:5px
}

/* =========================
   CORBEILLES
========================= */

.wishlist-delete,
.library-delete{
margin-left:auto;
flex:none;
width:34px;
height:34px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
border:0;
background:transparent;
color:#fff;
font-size:17px;
line-height:1;
cursor:pointer;
border-radius:8px
}

.wishlist-delete:hover,
.library-delete:hover{
background:#20202a
}

/* =========================
   LIBRARY
========================= */

.library-tools{
display:grid;
grid-template-columns:1fr 180px 180px;
gap:10px;
margin-bottom:15px
}

.library-tools input,
.library-tools select{
width:100%;
padding:11px;
background:#15151c;
color:#fff;
border:1px solid #30303a;
border-radius:10px
}

.count{
color:#858590;
font-size:14px;
margin-bottom:15px
}

.library-item{
display:flex;
gap:14px;
align-items:center;
padding:12px;
margin-bottom:10px;
background:#14141b;
border:1px solid #25252f;
border-radius:13px;
cursor:pointer
}

.library-item:hover{
border-color:#444451
}

.library-item img{
width:65px;
height:85px;
object-fit:cover;
border-radius:8px
}

.library-info{
flex:1;
min-width:0
}

.library-name{
font-weight:850
}

.library-small{
color:#777783;
font-size:12px;
margin-top:4px
}

.library-line{
font-size:13px;
margin-top:5px
}

.badge{
display:inline-block;
margin-top:7px;
padding:5px 8px;
background:#20202a;
border-radius:7px;
font-size:11px;
color:#bbb
}

/* =========================
   WISHLIST
========================= */

.wishlist-tools{
display:grid;
grid-template-columns:1fr 180px;
gap:10px;
margin-bottom:15px
}

.wishlist-tools input,
.wishlist-tools select{
width:100%;
background:#15151c;
color:#fff;
border:1px solid #292933;
padding:11px;
border-radius:10px
}

.wishlist-item{
display:flex;
gap:14px;
align-items:center;
background:#14141b;
border:1px solid #292933;
padding:12px;
border-radius:13px;
margin-bottom:10px;
cursor:pointer
}

.wishlist-item img{
width:65px;
height:85px;
object-fit:cover;
border-radius:8px
}

.wishlist-info{
flex:1;
min-width:0
}

.wishlist-name{
font-weight:850
}

.wishlist-date{
color:#858590;
font-size:12px;
margin-top:5px
}

.wishlist-count{
color:#858590;
font-size:13px;
margin-bottom:12px
}

.wishlist-badge{
display:inline-block;
margin-top:7px;
padding:5px 8px;
border-radius:7px;
background:#20202a;
font-size:11px;
color:#bbb
}

/* =========================
   UPCOMING
========================= */

.upcoming-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:15px
}

.upcoming-card{
background:#14141b;
border:1px solid #292933;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.15s
}

.upcoming-card:hover{
transform:translateY(-3px);
border-color:#555563
}

.upcoming-card img{
display:block;
width:100%;
height:235px;
object-fit:cover
}

.upcoming-body{
padding:11px
}

.upcoming-name{
font-weight:850;
line-height:1.3
}

.upcoming-date{
color:#858590;
font-size:12px;
margin-top:6px
}

.countdown{
margin-top:8px;
display:inline-block;
padding:5px 8px;
border-radius:7px;
background:#242630;
font-size:11px;
font-weight:800
}

/* =========================
   GENRES
========================= */

.genre-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:18px
}

.genre-list button{
border:1px solid #2b2b35;
background:#191920;
color:#ddd;
padding:11px 14px;
border-radius:10px;
font-weight:800;
cursor:pointer
}

.genre-list button:hover{
background:#24242d
}

.genre-list button.active{
background:#fff;
color:#000
}

.genre-tags{
display:flex;
flex-wrap:wrap;
gap:6px
}

.genre-tag{
border:1px solid #353540;
background:#1b1b23;
color:#fff;
border-radius:8px;
padding:6px 8px;
font-size:12px;
font-weight:800;
cursor:pointer
}

.genre-tag:hover{
background:#2a2a34
}

.genre-loading{
grid-column:1/-1;
text-align:center;
padding:40px;
color:#858590
}

/* =========================
   STATS
========================= */

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.stat{
background:#14141b;
border:1px solid #292933;
border-radius:14px;
padding:17px
}

.stat-icon{
font-size:24px
}

.stat-number{
font-size:28px;
font-weight:900;
margin-top:7px
}

.stat-label{
font-size:12px;
color:#858590;
margin-top:4px
}

.stats-box{
margin-top:15px;
background:#14141b;
border:1px solid #292933;
border-radius:14px;
padding:18px
}

.big{
font-size:32px;
font-weight:900
}

.bar{
height:13px;
background:#292933;
border-radius:20px;
overflow:hidden;
margin-top:12px
}

.fill{
height:100%;
background:#fff
}

.best{
display:flex;
align-items:center;
gap:14px
}

.best img{
width:60px;
height:80px;
object-fit:cover;
border-radius:8px
}

/* =========================
   STUDIO / WIKI
========================= */

.studio-page{
margin-top:18px
}

.studio-hero{
background:#14141b;
border:1px solid #292933;
border-radius:18px;
overflow:hidden;
position:relative
}

.studio-hero-image{
width:100%;
height:280px;
object-fit:cover;
display:block
}

.studio-hero-overlay{
position:absolute;
left:0;
right:0;
bottom:0;
padding:30px 22px 22px;
background:linear-gradient(
transparent,
rgba(9,9,13,.95)
)
}

.studio-type{
display:inline-block;
font-size:11px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
padding:6px 9px;
border-radius:7px;
background:#fff;
color:#000;
margin-bottom:9px
}

.studio-name{
font-size:36px;
font-weight:950;
line-height:1.05
}

.studio-content{
padding:20px
}

.studio-wiki-grid{
display:grid;
grid-template-columns:1fr 300px;
gap:15px
}

.studio-box{
background:#0d0d12;
border:1px solid #292933;
border-radius:13px;
padding:17px
}

.studio-box-title{
font-size:17px;
font-weight:900;
margin-bottom:12px
}

.studio-description{
color:#c9c9d0;
line-height:1.7;
font-size:15px
}

.studio-facts{
display:flex;
flex-direction:column;
gap:11px
}

.studio-fact{
border-bottom:1px solid #24242d;
padding-bottom:10px
}

.studio-fact:last-child{
border-bottom:0;
padding-bottom:0
}

.studio-fact-label{
font-size:11px;
color:#777783;
text-transform:uppercase;
margin-bottom:4px
}

.studio-fact-value{
font-weight:800;
font-size:14px
}

.studio-count{
font-size:30px;
font-weight:950
}

.studio-games-section{
margin-top:15px;
background:#14141b;
border:1px solid #292933;
border-radius:14px;
padding:17px
}

.studio-games-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:15px
}

.studio-games-title{
font-size:20px;
font-weight:900
}

.studio-games-count{
font-size:13px;
color:#858590
}

.studio-source{
margin-top:12px;
font-size:11px;
color:#777783
}

.studio-source a{
color:#aaa;
text-decoration:none
}

.studio-loading{
text-align:center;
padding:45px;
color:#858590
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

.detail-top{
grid-template-columns:1fr
}

.cover{
max-width:280px
}

.stats-grid{
grid-template-columns:repeat(2,1fr)
}

.studio-wiki-grid{
grid-template-columns:1fr
}

}

@media(max-width:600px){

main{
padding:15px
}

.search{
flex-direction:column
}

.search button{
height:48px
}

.games{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.card img{
height:230px
}

.detail-title{
font-size:28px
}

.meta{
grid-template-columns:1fr
}

.library-tools{
grid-template-columns:1fr
}

.wishlist-tools{
grid-template-columns:1fr
}

.stats-grid{
grid-template-columns:repeat(2,1fr)
}

.studio-name{
font-size:28px
}

.studio-hero-image{
height:230px
}

}
</style>
</head>

<body>

<header>
<div class="logo">🎮 GameVault</div>
<div class="subtitle">Ta bibliothèque gaming • Genres RAWG</div>
</header>

<nav>
<button id="tabSearch" class="active" onclick="showSearch()">🔎 Recherche</button>
<button id="tabLibrary" onclick="showLibrary()">📚 Ma bibliothèque</button>
<button id="tabWishlist" onclick="showWishlist()">❤️ Souhaits</button>
<button id="tabUpcoming" onclick="showUpcoming()">📅 Prochaines sorties</button>
<button id="tabGenres" onclick="showGenres()">🎭 Genres</button>
<button id="tabStats" onclick="showStats()">📊 Statistiques</button>
</nav>

<main>

<section id="searchSection">

<div class="search">
<input id="searchInput" placeholder="Rechercher un jeu...">
<button onclick="searchGames()">Rechercher</button>
</div>

<div id="status" class="status">
Recherche ton prochain jeu 🎮
</div>

<div id="games" class="games"></div>

</section>


<section id="detailSection" class="hidden">

<button class="back" onclick="showSearch()">← Retour</button>

<div id="detail"></div>

</section>


<section id="studioSection" class="hidden">

<button class="back" onclick="goBackFromStudio()">← Retour</button>

<div id="studioDetail"></div>

</section>


<section id="librarySection" class="hidden">

<h2>📚 Ma bibliothèque</h2>

<div class="library-tools">

<input
id="librarySearch"
placeholder="🔎 Rechercher..."
oninput="renderLibrary"
>

<select id="statusFilter" onchange="renderLibrary()">
<option value="Tous">Tous les statuts</option>
<option value="À jouer">À jouer</option>
<option value="En cours">En cours</option>
<option value="Terminé">Terminé</option>
</select>

<select id="sortFilter" onchange="renderLibrary()">
<option value="recent">Plus récent</option>
<option value="name">Nom A → Z</option>
<option value="rating">Meilleure note</option>
<option value="progress">Progression</option>
<option value="time">Temps de jeu</option>
</select>

</div>

<div id="libraryCount" class="count"></div>
<div id="library"></div>

</section>


<section id="wishlistSection" class="hidden">

<h2>❤️ Ma liste de souhaits</h2>

<div class="wishlist-tools">

<input
id="wishlistSearch"
placeholder="🔎 Rechercher dans mes souhaits..."
oninput="renderWishlist()"
>

<select id="wishlistSort" onchange="renderWishlist()">
<option value="date">Date de sortie</option>
<option value="name">Nom A → Z</option>
</select>

</div>

<div id="wishlistCount" class="wishlist-count"></div>
<div id="wishlist"></div>

</section>


<section id="upcomingSection" class="hidden">

<h2>📅 Prochaines sorties</h2>

<div id="upcomingStatus" class="status">
Chargement des prochains jeux...
</div>

<div id="upcoming" class="upcoming-grid"></div>

<button
id="upcomingMore"
class="back hidden"
style="margin-top:18px"
onclick="loadMoreUpcoming()">
Charger plus
</button>

</section>


<section id="genresSection" class="hidden">

<h2>🎭 Genres</h2>

<div class="genre-list">

<button onclick="loadGenre('action','Action')">🥷 Action</button>
<button onclick="loadGenre('indie','Indie')">✨ Indie</button>
<button onclick="loadGenre('adventure','Aventure')">🗺️ Aventure</button>
<button onclick="loadGenre('role-playing-games-rpg','RPG')">⚔️ RPG</button>
<button onclick="loadGenre('strategy','Stratégie')">🧠 Stratégie</button>
<button onclick="loadGenre('shooter','Shooter')">🔫 Shooter</button>
<button onclick="loadGenre('casual','Casual')">🙂 Casual</button>
<button onclick="loadGenre('simulation','Simulation')">🛠️ Simulation</button>
<button onclick="loadGenre('puzzle','Puzzle')">🧩 Puzzle</button>
<button onclick="loadGenre('arcade','Arcade')">👾 Arcade</button>
<button onclick="loadGenre('platformer','Platformer')">🕹️ Platformer</button>
<button onclick="loadGenre('racing','Racing')">🏎️ Racing</button>
<button onclick="loadGenre('sports','Sports')">🏀 Sports</button>
<button onclick="loadGenre('fighting','Fighting')">🥊 Fighting</button>
<button onclick="loadGenre('massively-multiplayer','Massively Multiplayer')">🌐 Massively Multiplayer</button>
<button onclick="loadGenre('family','Family')">👨‍👩‍👧‍👦 Family</button>
<button onclick="loadGenre('board-games','Board Games')">🎲 Board Games</button>
<button onclick="loadGenre('educational','Educational')">🎓 Educational</button>
<button onclick="loadGenre('card','Card')">🃏 Card</button>

</div>

<div id="genreStatus" class="status">
Choisis un genre 🎮
</div>

<div id="genreGames" class="games"></div>

<button
id="genreMore"
class="back hidden"
style="margin-top:18px"
onclick="loadMoreGenre()">
Charger plus
</button>

</section>


<section id="statsSection" class="hidden">

<h2>📊 Mes statistiques</h2>

<div id="statsContent"></div>

</section>

</main>

<script>

const WORKER_URL =
"https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;
let previousStudioContext = "detail";

let library =
JSON.parse(localStorage.getItem("gamevault_library")) || [];

let wishlist =
JSON.parse(localStorage.getItem("gamevault_wishlist")) || [];


/* =========================
   SAUVEGARDE
========================= */

function saveLibrary(){

localStorage.setItem(
"gamevault_library",
JSON.stringify(library)
);

}

function saveWishlist(){

localStorage.setItem(
"gamevault_wishlist",
JSON.stringify(wishlist)
);


/* =========================
   RECHERCHE
========================= */

async function searchGames(){

const input =
document.getElementById("searchInput");

const games =
document.getElementById("games");

const status =
document.getElementById("status");

const query =
input.value.trim();

if(query.length < 2){

status.textContent =
"Écris au moins 2 caractères.";

return;

}

status.textContent =
"Recherche en cours...";

games.innerHTML =
'<div class="empty">🔎 Recherche...</div>';

try{

const response =
await fetch(
WORKER_URL +
"/search?q=" +

await response.json();

games.innerHTML = "";

data.results.forEach(game=>{

createGameCard(game)
);

}catch(error){

"Erreur lors de la recherche.";

async function loadStudioGames(

append=false
){

return;

const container =
document.getElementById(
"studioGames"
);

const more =
document.getElementById(
"studioMore"
);

const count =
document.getElementById(
"studioGamesCount"
);

studioLoading = false;
return;

if(!append){

container.innerHTML =
`
<div class="studio-loading">

</div>

studioGames = [];

try{

currentStudio.type;

currentStudio.id;

   Endpoint du Worker :
   /studio/developer/ID/games?page=X
   /studio/publisher/ID/games?page=X
*/

await fetch(
WORKER_URL +
"/studio/" +
encodeURIComponent(type) +
"/" +
encodeURIComponent(id) +
"/games?page=" +
page
);

"Impossible de charger les jeux du studio."
);

}

await response.json();

const results =
Array.isArray(data.results)
?
data.results
:
[];

container.innerHTML = "";

results.forEach(game=>{

Number(game.id);

return;

studioGameIds.add(id);

studioGames.push(game);

container.appendChild(
createGameCard(game)
);

studioHasMore =
Boolean(
data.next
);


studioPage =
page;


more.classList.toggle(
"hidden",
!studioHasMore
);


if(count){

const total =
data.count ||
currentStudio.games_count ||
studioGames.length;

count.textContent =
`${studioGames.length} jeu(x) chargé(s)` +
(
total
?
` sur ${total}`

""
);

container.innerHTML = `

❌ ${escapeHtml(error.message)}

}

}finally{

studioLoading = false;

}

}

/* =========================

========================= */

function getCurrentSaved(){

if(!currentGame)
return null;

return library.find(
item =>
Number(item.id) ===
Number(currentGame.id)
);

}


function ensureSaved(){

let game =
getCurrentSaved();

if(game)
return game;

game = {

id:currentGame.id,

name:currentGame.name,

background_image:
currentGame.background_image,

released:
currentGame.released,

note:0,

progress:0,

hours:0,

minutes:0,

status:"À jouer",

addedAt:Date.now()

};

library.push(game);

saveLibrary();

return game;

}


function addCurrentGame(){

ensureSaved();

renderDetail();

}


function changeRating(amount){

const game =
ensureSaved();

let rating =
Number(game.note || 0) +
amount;

rating =
Math.round(rating * 2) / 2;

rating =
Math.max(
0,
Math.min(
10,
rating
)
);

game.note =
rating;

saveLibrary();

const value =
document.getElementById(
"ratingValue"
);

if(value)
value.textContent =
rating;

updateRatingButtons();

}


function updateRatingButtons(){

const game =
getCurrentSaved();

if(!game)
return;

const minus =
document.getElementById(
"minusRating"
);

const plus =
document.getElementById(
"plusRating"
);

if(minus)
minus.disabled =
Number(game.note || 0) <= 0;

if(plus)
plus.disabled =
Number(game.note || 0) >= 10;

}


function changeProgress(value){

const game =
ensureSaved();

game.progress =
Number(value);

const display =
document.getElementById(
"progressValue"
);

if(display)
display.textContent =
value;

saveLibrary();

}


function saveTime(){

const game =
ensureSaved();

let hours =
parseInt(
document.getElementById(
"hoursInput"
).value
) || 0;

let minutes =
parseInt(
document.getElementById(
"minutesInput"
).value
) || 0;

hours +=
Math.floor(
minutes / 60
);

minutes =
minutes % 60;

game.hours =
Math.max(0,hours);

game.minutes =
Math.max(0,minutes);

saveLibrary();

renderDetail();

}


function changeStatus(value){

const game =
ensureSaved();

game.status =
value;

saveLibrary();

renderDetail();

}


function deleteCurrentGame(){

if(!currentGame)
return;

const gameId =
Number(currentGame.id);

if(!confirm(
"Supprimer ce jeu de ta bibliothèque ?"
))
return;

library =
library.filter(
item =>
Number(item.id) !== gameId
);

saveLibrary();

showLibrary();

}


function deleteLibraryGame(
gameId
){

const id =
Number(gameId);

const game =
library.find(
item =>
Number(item.id) === id
);

if(!game)
return;

if(!confirm(
`Supprimer "${game.name}" de ta bibliothèque ?`
))
return;

library =
library.filter(
item =>
Number(item.id) !== id
);

saveLibrary();

renderLibrary();

}


function renderLibrary(){

const container =
document.getElementById(
"library"
);

if(!container)
return;

const search =
(
document.getElementById(
"librarySearch"
).value || ""
)
.toLowerCase()
.trim();

const statusFilter =
document.getElementById(
"statusFilter"
).value;

const sort =
document.getElementById(
"sortFilter"
).value;

let items =
library.filter(game=>{

const name =
(game.name || "")
.toLowerCase();

const matchesSearch =
name.includes(search);

const matchesStatus =
statusFilter === "Tous" ||
game.status === statusFilter;

return matchesSearch &&
matchesStatus;

});


items.sort((a,b)=>{

if(sort === "name")
return (a.name || "")
.localeCompare(
b.name || "",
"fr"
);

if(sort === "rating")
return Number(b.note || 0) -
Number(a.note || 0);

if(sort === "progress")
return Number(b.progress || 0) -
Number(a.progress || 0);

if(sort === "time"){

const ta =
Number(a.hours || 0) * 60 +
Number(a.minutes || 0);

const tb =
Number(b.hours || 0) * 60 +
Number(b.minutes || 0);

return tb - ta;

}

return Number(b.addedAt || 0) -
Number(a.addedAt || 0);

});


document.getElementById(
"libraryCount"
).textContent =
`${items.length} jeu(x) dans ta bibliothèque`;


if(!items.length){

container.innerHTML =
'<div class="empty">📚 Aucun jeu trouvé.</div>';

return;

}


container.innerHTML = "";

items.forEach(game=>{

const item =
document.createElement("div");

item.className =
"library-item";

function toggleWishlist(){

if(!currentGame)
return;

const index =
wishlist.findIndex(
item =>
Number(item.id) ===
Number(currentGame.id)
);

if(index >= 0){

wishlist.splice(index,1);

}else{

wishlist.push({

id:currentGame.id,

name:currentGame.name,

background_image:
currentGame.background_image,

released:
currentGame.released || null,

tba:
!!currentGame.tba,

addedAt:Date.now()

});

}

saveWishlist();

renderDetail();

}


function removeFromWishlist(
gameId
){

const id =
Number(gameId);

wishlist =
wishlist.filter(
item =>
Number(item.id) !== id
);

saveWishlist();

renderWishlist();

}


function daysUntil(
dateString
){

if(!dateString)
return null;

const today =
new Date();

today.setHours(
0,0,0,0
);

const date =
new Date(
dateString +
"T00:00:00"
);

if(Number.isNaN(
date.getTime()
))
return null;

return Math.ceil(
(date - today) /
86400000
);

}


function releaseLabel(
game
){

if(
game.tba ||
!game.released
)
return "📅 Date à confirmer";

const days =
daysUntil(
game.released
);

if(days === null)
return "📅 Date inconnue";

if(days < 0)
return "🟢 Sorti";

if(days === 0)
return "🔥 Sortie aujourd'hui";

if(days === 1)
return "⏳ Sortie demain";

return `⏳ Sortie dans ${days} jours`;

}


function renderWishlist(){

const container =
document.getElementById(
"wishlist"
);

if(!container)
return;

const search =
(
document.getElementById(
"wishlistSearch"
).value || ""
)
.toLowerCase()
.trim();

const sort =
document.getElementById(
"wishlistSort"
).value;

let items =
wishlist.filter(item =>
(item.name || "")
.toLowerCase()
.includes(search)
);


items.sort((a,b)=>{

if(sort === "name"){

return (a.name || "")
.localeCompare(
b.name || "",
"fr"
);

}

const da =
a.released ||
"9999-12-31";

const db =
b.released ||
"9999-12-31";

return da.localeCompare(db);

});


document.getElementById(
"wishlistCount"
).textContent =
`${items.length} jeu(x) dans tes souhaits`;


if(!items.length){

container.innerHTML =
'<div class="empty">❤️ Aucun jeu dans ta liste de souhaits.</div>';

}


container.innerHTML = "";

items.forEach(game=>{

const item =
document.createElement("div");

"wishlist-item";

game.background_image ||
"https://via.placeholder.com/100x150?text=Game";

</div>

${escapeHtml(

)}

}


/* =========================
   UPCOMING
========================= */

let upcomingPage = 1;
let upcomingHasMore = false;

async function fetchUpcomingPage(
page=1,
append=false
){

const container =
document.getElementById(
"upcoming"
);

const status =
document.getElementById(
"upcomingStatus"
);

const more =
document.getElementById(
"upcomingMore"
);

if(!container || !status)
return;

if(!append){

container.innerHTML =
'<div class="empty">📅 Chargement...</div>';

upcomingPage =
1;

}

status.textContent =
append
?
"Chargement de jeux supplémentaires..."
:
"Recherche des prochaines sorties...";

const today =
new Date();

const from =
today.toISOString()
.slice(0,10);

const future =
new Date(today);

future.setDate(
future.getDate() + 365
);

const to =
future.toISOString()
.slice(0,10);

try{

const response =
await fetch(
WORKER_URL +
"/upcoming?from=" +
encodeURIComponent(from) +
"&to=" +
encodeURIComponent(to) +
"&page=" +
page
);

const data =
await response.json();

if(
!response.ok ||
!Array.isArray(data.results)
)
throw new Error(
data.error ||
"Impossible de charger les sorties"
);

const games =
data.results
.filter(game =>
game.released
)
.sort((a,b)=>
a.released.localeCompare(
b.released
)
);

if(!append)
container.innerHTML = "";

games.forEach(game=>{

const card =
document.createElement("div");

card.className =
"upcoming-card";

const image =
game.background_image ||
"https://via.placeholder.com/400x600?text=Game";

card.innerHTML = `

<img
src="${escapeHtml(image)}"
alt=""
loading="lazy"
>

<div class="upcoming-body">

<div class="upcoming-name">
${escapeHtml(game.name || "Jeu")}
</div>

<div class="upcoming-date">
📅 ${escapeHtml(game.released)}
</div>

<div class="countdown">
${releaseLabel(game)}
</div>

</div>

`;

card.onclick =
()=>openGame(game);

container.appendChild(card);

});


upcomingHasMore =
Boolean(data.next);

upcomingPage =
page;

more.classList.toggle(
"hidden",
!upcomingHasMore
);

status.textContent =
`${container.querySelectorAll(".upcoming-card").length} prochaine(s) sortie(s) affichée(s).`;

if(!container.querySelector(
".upcoming-card"
)){

container.innerHTML =
'<div class="empty">Aucune sortie trouvée.</div>';

}

}catch(error){

console.error(error);

status.textContent =
"Erreur lors du chargement des sorties.";

if(!append){

container.innerHTML =
`
<div class="empty">
❌ ${escapeHtml(error.message)}
</div>
`;

}

}

}


async function loadUpcoming(){

await fetchUpcomingPage(
1,
false
);

}


async function loadMoreUpcoming(){

if(upcomingHasMore)
await fetchUpcomingPage(
upcomingPage + 1,
true
);

}


/* =========================
   GENRES RAWG
========================= */

let currentGenreSlug = "";
let currentGenreLabel = "";
let genrePage = 1;
let genreHasMore = false;
let genreLoading = false;
let genreSeenIds = new Set();


async function fetchGenrePage(
page=1,
append=false
){

if(genreLoading)
return;

genreLoading = true;

const container =
document.getElementById(
"genreGames"
);

const status =
document.getElementById(
"genreStatus"
);

const more =
document.getElementById(
"genreMore"
);

if(!container || !status){

genreLoading = false;

return;

}

if(!append){

container.innerHTML =
'<div class="genre-loading">🎭 Chargement des jeux...</div>';

genreSeenIds =
new Set();

}

status.textContent =
`Recherche des jeux ${currentGenreLabel}...`;

try{

const response =
await fetch(
WORKER_URL +
"/genre/" +
encodeURIComponent(
currentGenreSlug
) +
"?page=" +
page
);

const data =
await response.json();

if(
!response.ok ||
!Array.isArray(data.results)
){

throw new Error(
data.error ||
"Impossible de charger ce genre"
);

}

if(!append)
container.innerHTML = "";

(data.results || [])
.forEach(game=>{

const id =
Number(game.id);

if(
genreSeenIds.has(id)
)
return;

genreSeenIds.add(id);

container.appendChild(
createGameCard(game)
);

});

genreHasMore =
Boolean(data.next);

genrePage =
page;

more.classList.toggle(
"hidden",
!genreHasMore
);

status.textContent =
`${container.querySelectorAll(".card").length} jeu(x) affiché(s) dans ${currentGenreLabel}.`;

if(!container.querySelector(
".card"
)){

container.innerHTML = `
<div class="empty">
Aucun jeu trouvé dans ce genre RAWG.
</div>
`;

}

}catch(error){

console.error(error);

status.textContent =
"Erreur lors du chargement du genre.";

if(!append){

container.innerHTML = `
<div class="empty">
❌ ${escapeHtml(error.message)}
</div>
`;

}

}finally{

genreLoading = false;

}

}


async function loadGenre(
slug,
label
){

currentGenreSlug =
slug;

currentGenreLabel =
label;

genrePage =
1;

genreHasMore =
false;

genreSeenIds =
new Set();

await fetchGenrePage(
1,
false
);

}


async function loadMoreGenre(){

if(genreLoading)
return;

const targetPages =
3;

let loadedPages =
0;

while(
genreHasMore &&
loadedPages < targetPages
){

const nextPage =
genrePage + 1;

await fetchGenrePage(
nextPage,
true
);

loadedPages++;

}

}

function renderStats(){

const container =
document.getElementById(
"statsContent"
);

if(!container)
return;

const total =
library.length;

const finished =
library.filter(
g =>
g.status === "Terminé"
).length;

const inProgress =
library.filter(
g =>
g.status === "En cours"
).length;

const toPlay =
library.filter(
g =>
g.status === "À jouer"
).length;

const totalMinutes =
library.reduce(
(sum,g)=>
sum +
Number(g.hours || 0) * 60 +
Number(g.minutes || 0),
0
);

const totalHours =
Math.floor(
totalMinutes / 60
);

const averageRating =
total
?
(
library.reduce(
(sum,g)=>
sum +
Number(g.note || 0),
0
) / total
).toFixed(1)
:
"0.0";

total

Math.round(
library.reduce(
(sum,g)=>
sum +
Number(g.progress || 0),
0

)

0;

[...library]
.sort(
(a,b)=>
Number(b.note || 0) -
Number(a.note || 0)

${total}

</div>

🏆
</div>

<div class="stat-number">
${finished}
</div>

<div class="stat-label">
Jeux terminés
</div>

</div>


<div class="stat">

<div class="stat-icon">
⏱️
</div>

<div class="stat-number">
${totalHours}h
</div>

<div class="stat-label">
Temps de jeu
</div>

</div>


<div class="stat">

⭐
</div>

${averageRating}
</div>

<div class="stat-label">
Note moyenne
</div>

</div>

</div>

/* =========================
   UTILITAIRES
========================= */

function stripHtml(html){

const div =
document.createElement("div");

div.innerHTML =
html || "";

return div.textContent ||
div.innerText ||
"";

}


function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text == null
?
""
:
String(text);

return div.innerHTML;

}
