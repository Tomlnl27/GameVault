<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#09090d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

header{
  padding:22px 18px 18px;
  background:#101016;
  border-bottom:1px solid #24242d
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1px
}

.subtitle{
  color:#858590;
  font-size:14px;
  margin-top:4px
}

nav{
  display:flex;
  gap:8px;
  padding:12px 16px;
  background:#101016;
  border-bottom:1px solid #20202a;
  overflow-x:auto
}

nav button{
  border:1px solid #2b2b35;
  background:#191920;
  color:#ddd;
  padding:10px 14px;
  border-radius:10px;
  white-space:nowrap;
  font-weight:700;
  cursor:pointer
}

nav button.active{
  background:#fff;
  color:#000
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px
}

.hidden{
  display:none!important
}

/* =========================
   RECHERCHE
========================= */

.search{
  display:flex;
  gap:10px;
  margin-bottom:18px
}

.search input{
  flex:1;
  min-width:0;
  background:#15151c;
  color:#fff;
  border:1px solid #30303a;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none
}

.search button,
.add{
  border:0;
  background:#fff;
  color:#000;
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer
}

.status,
.count,
.wishlist-count{
  color:#858590;
  font-size:14px;
  margin-bottom:18px
}

/* =========================
   CARTES JEUX
========================= */

.games{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px
}

.card{
  background:#14141b;
  border:1px solid #25252f;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s
}

.card:hover{
  transform:translateY(-3px);
  border-color:#555563
}

.card img{
  display:block;
  width:100%;
  height:225px;
  object-fit:cover
}

.card-content{
  padding:12px
}

.card-title{
  font-weight:800;
  line-height:1.25
}

.card-date{
  font-size:12px;
  color:#777783;
  margin-top:6px
}

.empty{
  text-align:center;
  color:#777783;
  padding:50px 15px
}

/* =========================
   BOUTONS
========================= */

.back{
  border:0;
  background:#20202a;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700
}

select{
  background:#1b1b23;
  color:#fff;
  border:1px solid #353540;
  border-radius:9px;
  padding:10px;
  outline:none
}

/* =========================
   FICHE JEU
========================= */

.detail{
  margin-top:18px;
  background:#14141b;
  border:1px solid #292933;
  border-radius:18px;
  overflow:hidden
}

.detail-top{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:25px;
  padding:20px
}

.cover{
  width:100%;
  max-height:460px;
  object-fit:cover;
  border-radius:13px
}

.detail-title{
  font-size:35px;
  line-height:1.05;
  margin:5px 0 8px
}

.release{
  color:#858590;
  font-size:14px;
  margin-bottom:18px
}

.description{
  color:#c9c9d0;
  line-height:1.65;
  font-size:15px
}

.meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px
}

.meta-box{
  background:#0d0d12;
  border:1px solid #292933;
  border-radius:13px;
  padding:16px
}

.meta-label{
  font-size:11px;
  color:#777783;
  margin-bottom:5px
}

.meta-value{
  font-size:14px;
  font-weight:700
}

.studio-links,
.genre-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.studio-link,
.genre-tag{
  display:inline-block;
  background:#20202a;
  color:#fff;
  border:1px solid #353540;
  padding:7px 10px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer
}

/* =========================
   PANELS
========================= */

.panel{
  margin:0 20px 15px;
  background:#0d0d12;
  border:1px solid #292933;
  border-radius:13px;
  padding:16px
}

.panel-title{
  font-weight:800;
  margin-bottom:12px
}

.rating{
  font-size:30px;
  font-weight:900;
  margin-bottom:12px
}

.rating-controls{
  display:flex;
  align-items:center;
  gap:12px
}

.rating-controls button{
  width:43px;
  height:43px;
  border-radius:10px;
  border:1px solid #34343f;
  background:#20202a;
  color:#fff;
  font-size:23px;
  cursor:pointer
}

.rating-controls button:disabled{
  opacity:.3
}

.slider{
  width:100%;
  margin-top:8px
}

.progress-number{
  font-size:24px;
  font-weight:900
}

.time-inputs{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.time-inputs input{
  width:100px;
  padding:10px;
  background:#1b1b23;
  color:#fff;
  border:1px solid #353540;
  border-radius:9px
}

.action{
  margin:0 20px 20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.action button{
  padding:12px 15px;
  border-radius:10px;
  border:0;
  font-weight:800;
  cursor:pointer
}

.delete{
  background:#2a171a;
  color:#ff929b
}

.in-library{
  background:#20202a!important;
  color:#fff!important;
  cursor:default!important
}

/* =========================
   SÉRIE
========================= */

.series-panel{
  margin:0 20px 15px;
  background:#0d0d12;
  border:1px solid #292933;
  border-radius:13px;
  padding:16px
}

.series-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:13px
}

.series-list{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:6px
}

.series-card{
  flex:0 0 135px;
  background:#15151c;
  border:1px solid #292933;
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s
}

.series-card:hover{
  transform:translateY(-3px);
  border-color:#555563
}

.series-card img{
  display:block;
  width:100%;
  height:185px;
  object-fit:cover
}

.series-card-body{
  padding:9px
}

.series-card-name{
  font-size:13px;
  font-weight:800;
  line-height:1.25
}

.series-card-date{
  font-size:11px;
  color:#777783;
  margin-top:5px
}

/* =========================
   BIBLIOTHÈQUE
========================= */

.library-tools{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:10px;
  margin-bottom:15px
}

.library-tools input,
.library-tools select,
.wishlist-tools input,
.wishlist-tools select{
  width:100%;
  padding:11px;
  background:#15151c;
  color:#fff;
  border:1px solid #30303a;
  border-radius:10px
}

.library-item,
.wishlist-item{
  display:flex;
  gap:14px;
  align-items:center;
  padding:12px;
  margin-bottom:10px;
  background:#14141b;
  border:1px solid #25252f;
  border-radius:13px;
  cursor:pointer
}

.library-item:hover,
.wishlist-item:hover{
  border-color:#444451
}

.library-item img,
.wishlist-item img{
  width:65px;
  height:85px;
  object-fit:cover;
  border-radius:8px
}

.library-info,
.wishlist-info{
  flex:1;
  min-width:0
}

.library-name,
.wishlist-name{
  font-weight:850
}

.library-small,
.wishlist-date{
  color:#777783;
  font-size:12px;
  margin-top:4px
}

.library-line{
  font-size:13px;
  margin-top:5px
}

.badge,
.wishlist-badge,
.countdown{
  display:inline-block;
  margin-top:7px;
  padding:5px 8px;
  background:#20202a;
  border-radius:7px;
  font-size:11px;
  color:#bbb
}

.library-delete,
.wishlist-delete{
  margin-left:auto;
  flex:none;
  width:34px;
  height:34px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  font-size:17px;
  cursor:pointer;
  border-radius:8px
}

.library-delete:hover,
.wishlist-delete:hover{
  background:#20202a
}

/* =========================
   SOUHAITS
========================= */

.wishlist-tools{
  display:grid;
  grid-template-columns:1fr 180px;
  gap:10px;
  margin-bottom:15px
}

/* =========================
   SORTIES
========================= */

.upcoming-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:15px
}

.upcoming-card{
  background:#14141b;
  border:1px solid #292933;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s
}

.upcoming-card:hover{
  transform:translateY(-3px);
  border-color:#555563
}

.upcoming-card img{
  display:block;
  width:100%;
  height:235px;
  object-fit:cover
}

.upcoming-body{
  padding:11px
}

.upcoming-name{
  font-weight:850;
  line-height:1.3
}

.upcoming-date{
  color:#858590;
  font-size:12px;
  margin-top:6px
}

/* =========================
   GENRES
========================= */

.genre-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:18px
}

.genre-list button{
  border:1px solid #2b2b35;
  background:#191920;
  color:#ddd;
  padding:11px 14px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer
}

/* =========================
   STATS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.stat{
  background:#14141b;
  border:1px solid #292933;
  border-radius:14px;
  padding:17px
}

.stat-icon{
  font-size:24px
}

.stat-number{
  font-size:28px;
  font-weight:900;
  margin-top:7px
}

.stat-label{
  font-size:12px;
  color:#858590;
  margin-top:4px
}

.stats-box{
  margin-top:15px;
  background:#14141b;
  border:1px solid #292933;
  border-radius:14px;
  padding:18px
}

.big{
  font-size:32px;
  font-weight:900
}

.bar{
  height:13px;
  background:#292933;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px
}

.fill{
  height:100%;
  background:#fff
}

.best{
  display:flex;
  align-items:center;
  gap:14px
}

.best img{
  width:60px;
  height:80px;
  object-fit:cover;
  border-radius:8px
}

/* =========================================================
   STUDIO
========================================================= */

.studio-page{
  margin-top:18px
}

.studio-hero{
  background:#14141b;
  border:1px solid #292933;
  border-radius:18px;
  overflow:hidden;
  position:relative
}

.studio-hero-image{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block
}

.studio-hero-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:30px 22px 22px;
  background:linear-gradient(transparent,rgba(9,9,13,.96))
}

.studio-type{
  display:inline-block;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:6px 9px;
  border-radius:7px;
  background:#fff;
  color:#000;
  margin-bottom:9px
}

.studio-name{
  font-size:36px;
  font-weight:950;
  line-height:1.05
}

.studio-content{
  padding:20px
}

.studio-wiki-grid{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:15px
}

.studio-box{
  background:#0d0d12;
  border:1px solid #292933;
  border-radius:13px;
  padding:18px
}

.studio-box-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:13px
}

.studio-description{
  color:#c9c9d0;
  line-height:1.7;
  font-size:15px;
  white-space:pre-line
}

.studio-source{
  margin-top:15px;
  color:#777783;
  font-size:12px
}

.studio-facts{
  display:flex;
  flex-direction:column;
  gap:11px
}

.studio-fact{
  border-bottom:1px solid #24242d;
  padding-bottom:10px
}

.studio-fact:last-child{
  border-bottom:0;
  padding-bottom:0
}

.studio-fact-label{
  font-size:11px;
  color:#777783;
  margin-bottom:5px
}

.studio-fact-value{
  font-weight:800;
  font-size:14px
}

.studio-count{
  font-size:30px;
  font-weight:950
}

.studio-games-section{
  margin-top:15px;
  background:#14141b;
  border:1px solid #292933;
  border-radius:14px;
  padding:17px
}

.studio-games-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.studio-games-title{
  font-size:20px;
  font-weight:900
}

.studio-games-count{
  font-size:13px;
  color:#858590;
  margin-top:4px
}

.studio-loading{
  text-align:center;
  padding:45px;
  color:#858590
}

.studio-wiki-link{
  display:inline-block;
  margin-top:15px;
  padding:9px 12px;
  border-radius:9px;
  background:#20202a;
  border:1px solid #353540;
  color:#fff;
  text-decoration:none;
  font-weight:800
}

.studio-no-info{
  color:#777783;
  font-size:14px
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .detail-top{
    grid-template-columns:1fr
  }

  .cover{
    max-width:280px
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .studio-wiki-grid{
    grid-template-columns:1fr
  }
}

@media(max-width:600px){

  main{
    padding:15px
  }

  .search{
    flex-direction:column
  }

  .search button{
    height:48px
  }

  .games{
    grid-template-columns:repeat(2,1fr);
    gap:12px
  }

  .card img{
    height:230px
  }

  .detail-title{
    font-size:28px
  }

  .meta{
    grid-template-columns:1fr
  }

  .library-tools,
  .wishlist-tools{
    grid-template-columns:1fr
  }

  .studio-name{
    font-size:28px
  }

  .studio-hero-image{
    height:230px
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .series-card{
    flex-basis:125px
  }

  .series-card img{
    height:170px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 GameVault</div>
  <div class="subtitle">Ta bibliothèque gaming • RAWG + Wikipédia</div>
</header>

<nav>
  <button id="tabSearch" class="active" onclick="showSearch()">🔎 Recherche</button>
  <button id="tabLibrary" onclick="showLibrary()">📚 Ma bibliothèque</button>
  <button id="tabWishlist" onclick="showWishlist()">❤️ Souhaits</button>
  <button id="tabUpcoming" onclick="showUpcoming()">📅 Prochaines sorties</button>
  <button id="tabGenres" onclick="showGenres()">🎭 Genres</button>
  <button id="tabStats" onclick="showStats()">📊 Statistiques</button>
</nav>

<main>

<!-- =========================
     RECHERCHE
========================= -->

<section id="searchSection">

  <div class="search">
    <input id="searchInput" placeholder="Rechercher un jeu...">
    <button onclick="searchGames()">Rechercher</button>
  </div>

  <div id="status" class="status">
    Recherche ton prochain jeu 🎮
  </div>

  <div id="games" class="games"></div>

</section>


<!-- =========================
     FICHE JEU
========================= -->

<section id="detailSection" class="hidden">

  <button class="back" onclick="showSearch()">← Retour</button>

  <div id="detail"></div>

</section>


<!-- =========================
     FICHE STUDIO
========================= -->

<section id="studioSection" class="hidden">

  <button class="back" onclick="goBackFromStudio()">← Retour</button>

  <div id="studioDetail"></div>

</section>


<!-- =========================
     BIBLIOTHÈQUE
========================= -->

<section id="librarySection" class="hidden">

  <h2>📚 Ma bibliothèque</h2>

  <div class="library-tools">

    <input
      id="librarySearch"
      placeholder="🔎 Rechercher..."
      oninput="renderLibrary()"
    >

    <select id="statusFilter" onchange="renderLibrary()">
      <option value="Tous">Tous</option>
      <option value="À jouer">À jouer</option>
      <option value="En cours">En cours</option>
      <option value="Terminé">Terminé</option>
    </select>

    <select id="sortFilter" onchange="renderLibrary()">
      <option value="recent">Plus récent</option>
      <option value="name">Nom A → Z</option>
      <option value="rating">Meilleure note</option>
      <option value="progress">Progression</option>
      <option value="time">Temps de jeu</option>
    </select>

  </div>

  <div id="libraryCount" class="count"></div>

  <div id="library"></div>

</section>


<!-- =========================
     SOUHAITS
========================= -->

<section id="wishlistSection" class="hidden">

  <h2>❤️ Ma liste de souhaits</h2>

  <div class="wishlist-tools">

    <input
      id="wishlistSearch"
      placeholder="🔎 Rechercher dans mes souhaits..."
      oninput="renderWishlist()"
    >

    <select id="wishlistSort" onchange="renderWishlist()">
      <option value="date">Date de sortie</option>
      <option value="name">Nom A → Z</option>
    </select>

  </div>

  <div id="wishlistCount" class="wishlist-count"></div>

  <div id="wishlist"></div>

</section>


<!-- =========================
     PROCHAINES SORTIES
========================= -->

<section id="upcomingSection" class="hidden">

  <h2>📅 Prochaines sorties</h2>

  <div id="upcomingStatus" class="status">
    Chargement des prochains jeux...
  </div>

  <div id="upcoming" class="upcoming-grid"></div>

  <button
    id="upcomingMore"
    class="back hidden"
    style="margin-top:18px"
    onclick="loadMoreUpcoming()"
  >
    Charger plus
  </button>

</section>


<!-- =========================
     GENRES
========================= -->

<section id="genresSection" class="hidden">

  <h2>🎭 Genres</h2>

  <div class="genre-list">

    <button onclick="loadGenre('action','Action')">🥷 Action</button>
    <button onclick="loadGenre('indie','Indie')">✨ Indie</button>
    <button onclick="loadGenre('adventure','Aventure')">🗺️ Aventure</button>
    <button onclick="loadGenre('role-playing-games-rpg','RPG')">⚔️ RPG</button>
    <button onclick="loadGenre('strategy','Stratégie')">🧠 Stratégie</button>
    <button onclick="loadGenre('shooter','Shooter')">🔫 Shooter</button>
    <button onclick="loadGenre('casual','Casual')">🙂 Casual</button>
    <button onclick="loadGenre('simulation','Simulation')">🛠️ Simulation</button>
    <button onclick="loadGenre('puzzle','Puzzle')">🧩 Puzzle</button>
    <button onclick="loadGenre('arcade','Arcade')">👾 Arcade</button>
    <button onclick="loadGenre('platformer','Platformer')">🕹️ Platformer</button>
    <button onclick="loadGenre('racing','Racing')">🏎️ Racing</button>
    <button onclick="loadGenre('sports','Sports')">🏀 Sports</button>
    <button onclick="loadGenre('fighting','Fighting')">🥊 Fighting</button>
    <button onclick="loadGenre('massively-multiplayer','Massively Multiplayer')">🌐 MMO</button>
    <button onclick="loadGenre('family','Family')">👨‍👩‍👧‍👦 Family</button>
    <button onclick="loadGenre('board-games','Board Games')">🎲 Board Games</button>
    <button onclick="loadGenre('educational','Educational')">🎓 Educational</button>
    <button onclick="loadGenre('card','Card')">🃏 Card</button>

  </div>

  <div id="genreStatus" class="status">
    Choisis un genre 🎮
  </div>

  <div id="genreGames" class="games"></div>

  <button
    id="genreMore"
    class="back hidden"
    style="margin-top:18px"
    onclick="loadMoreGenre()"
  >
    Charger plus
  </button>

</section>


<!-- =========================
     STATS
========================= -->

<section id="statsSection" class="hidden">

  <h2>📊 Mes statistiques</h2>

  <div id="statsContent"></div>

</section>

</main>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const WORKER_URL =
  "https://gamevault-api.tom-lunel27200.workers.dev";


/* =========================================================
   VARIABLES
========================================================= */

let currentGame = null;

let currentStudio = null;

let previousStudioContext = "detail";

let library =
  JSON.parse(
    localStorage.getItem("gamevault_library")
  ) || [];

let wishlist =
  JSON.parse(
    localStorage.getItem("gamevault_wishlist")
  ) || [];


/* =========================================================
   STUDIO

let studioPage = 1;

function placeholder(){

/* =========================================================
   SÉCURITÉ HTML
========================================================= */

function escapeHtml(text){

  const d =
    document.createElement("div");

  d.textContent =
    text == null ? "" : String(text);

  return d.innerHTML;

}

function escapeAttr(text){

  return String(
    text == null ? "" : text
  )
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"&#39;")
  .replace(/"/g,"&quot;");

}


/* =========================================================
   NETTOYER HTML
========================================================= */

function stripHtml(html){

  const d =
    document.createElement("div");

  d.innerHTML =
    html || "";

  return (
    d.textContent ||
    d.innerText ||
    ""
  );

}

========================================================= */

async function searchGames(){

  const input =
    document.getElementById("searchInput");

  const games =
    document.getElementById("games");

  const status =
    document.getElementById("status");

  const query =
    input.value.trim();

  if(query.length < 2){

    status.textContent =
      "Écris au moins 2 caractères.";

    return;

  }

  status.textContent =
    "Recherche en cours...";

  games.innerHTML =
    '<div class="empty">🔎 Recherche...</div>';

  try{

    const response =
      await fetch(
        WORKER_URL +
        "/search?q=" +
        encodeURIComponent(query)
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.results
    ){

      throw new Error(
        data.error ||
        "Erreur RAWG"
      );

    }

    if(!data.results.length){

      games.innerHTML =
        '<div class="empty">Aucun jeu trouvé.</div>';

      status.textContent =
        "Aucun résultat.";

      return;

    }

    status.textContent =
      data.results.length +
      " jeu(x) trouvé(s).";

    games.innerHTML = "";

    data.results.forEach(game => {

      games.appendChild(
        createGameCard(game)
      );

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "Erreur lors de la recherche.";

    games.innerHTML =
      '<div class="empty">Impossible de contacter GameVault.</div>';

  }

}

function createGameCard(game){

  const card =
    document.createElement("div");

  card.className =
    "card";

  const image =
    game.background_image ||
    placeholder();

  card.innerHTML = `

    <img
      src="${escapeHtml(image)}"
      alt=""
      loading="lazy"
    >

    <div class="card-content">

      <div class="card-title">
        ${escapeHtml(game.name || "Jeu")}
      </div>

      <div class="card-date">
        ${escapeHtml(
          game.released ||
          "Date inconnue"
        )}
      </div>

    </div>

  `;

  card.onclick =
    () => openGame(game);

  return card;

}

========================================================= */

async function loadStudioGames(
  page = 1,
  append = false
){

  if(studioLoading)
    return;

  studioLoading = true;


  const container =
    document.getElementById(
      "studioGames"
    );

  const more =
    document.getElementById(
      "studioMore"
    );

  const count =
    document.getElementById(
      "studioGamesCount"
    );


  if(!container){

    studioLoading =
      false;

    return;

  }


  if(!append){

    container.innerHTML =
      '<div class="studio-loading">🎮 Chargement des jeux...</div>';

    studioGames = [];

    studioGameIds =
      new Set();

  }


  try{

    const endpoint =
      currentStudio.type ===
      "developer"

        ? "developers"

        : "publishers";


    const response =
      await fetch(

        WORKER_URL +
        "/" +
        endpoint +
        "/" +
        encodeURIComponent(
          currentStudio.id
        ) +
        "/games?page=" +
        page

      );


    if(!response.ok){

      let msg =
        "Impossible de charger les jeux du studio.";

      try{

        const data =
          await response.json();

        if(data.error)
          msg = data.error;

      }catch(_){}

      throw new Error(msg);

    }


    const data =
      await response.json();


    if(!append){

      container.innerHTML = "";

    }


    (data.results || [])
      .forEach(game => {

        const id =
          Number(game.id);

        if(
          studioGameIds.has(id)
        ){

          return;

        }


        studioGameIds.add(id);

        studioGames.push(game);

        container.appendChild(
          createGameCard(game)
        );

      });


    studioHasMore =
      Boolean(data.next);

    studioPage =
      page;


    if(more){

      more.classList.toggle(
        "hidden",
        !studioHasMore
      );

    }


    if(count){

      count.textContent =
        `${
          studioGames.length
        } jeu(x) chargé(s)${
          data.count
            ? ` sur ${data.count}`
            : ""
        }`;

    }


    if(
      !studioGames.length
    ){

      container.innerHTML =
        '<div class="empty">🎮 Aucun jeu trouvé pour ce studio.</div>';

    }


  }catch(error){

    console.error(error);


    if(!append){

      container.innerHTML = `

        <div class="empty">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

    }

  }finally{

    studioLoading =
      false;

  }

}

function getCurrentSaved(){

  if(!currentGame)
    return null;

  return library.find(
    x =>
      Number(x.id) ===
      Number(currentGame.id)
  );

}


function ensureSaved(){

  let game =
    getCurrentSaved();

  if(game)
    return game;


  game = {

    id:
      currentGame.id,

    name:
      currentGame.name,

    background_image:
      currentGame.background_image,

    released:
      currentGame.released,

    note:0,

    progress:0,

    hours:0,

    minutes:0,

    status:"À jouer",

    addedAt:
      Date.now()

  };


  library.push(game);

  saveLibrary();

  return game;

}


function addCurrentGame(){

  ensureSaved();

  renderDetail();

}


function changeRating(amount){

  const game =
    ensureSaved();


  game.note =
    Math.max(
      0,
      Math.min(
        10,
        Math.round(
          (
            Number(
              game.note || 0
            ) +
            amount
          ) * 2
        ) / 2
      )
    );


  saveLibrary();


  document
    .getElementById(
      "ratingValue"
    )
    .textContent =
      game.note;


  updateRatingButtons();

}


function updateRatingButtons(){

  const game =
    getCurrentSaved();

  if(!game)
    return;


  const minus =
    document.getElementById(
      "minusRating"
    );

  const plus =
    document.getElementById(
      "plusRating"
    );


  if(minus){

    minus.disabled =
      Number(
        game.note || 0
      ) <= 0;

  }


  if(plus){

    plus.disabled =
      Number(
        game.note || 0
      ) >= 10;

  }

}


function changeProgress(value){

  const game =
    ensureSaved();

  game.progress =
    Number(value);

  document
    .getElementById(
      "progressValue"
    )
    .textContent =
      value;

  saveLibrary();

}


function saveTime(){

  const game =
    ensureSaved();


  let hours =
    parseInt(
      document
        .getElementById(
          "hoursInput"
        )
        .value
    ) || 0;


  let minutes =
    parseInt(
      document
        .getElementById(
          "minutesInput"
        )
        .value
    ) || 0;


  hours +=
    Math.floor(
      minutes / 60
    );

  minutes %= 60;


  game.hours =
    Math.max(
      0,
      hours
    );

  game.minutes =
    Math.max(
      0,
      minutes
    );


  saveLibrary();

  renderDetail();

}


function changeStatus(value){

  const game =
    ensureSaved();

  game.status =
    value;

  saveLibrary();

  renderDetail();

}

function deleteLibraryGame(id){

  const game =
    library.find(
      x =>
        Number(x.id) ===

    );


  if(
    !game ||
    !confirm(
      `Supprimer "${game.name}" de ta bibliothèque ?`
    )
  )

  library =
    library.filter(
      x =>

    );

function renderLibrary(){

  const container =
    document.getElementById(
      "library"
    );


  const search =
    (
      document.getElementById(
        "librarySearch"
      ).value ||
      ""
    )
    .toLowerCase()
    .trim();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const sort =
    document.getElementById(
      "sortFilter"
    ).value;


  let items =
    library.filter(
      game =>
        (
          game.name || ""
        )
        .toLowerCase()
        .includes(search)

        &&

        (
          status === "Tous" ||
          game.status === status
        )
    );


  items.sort(
    (a,b) => {

      if(sort === "name"){

        return (
          a.name || ""
        ).localeCompare(
          b.name || "",
          "fr"
        );

      }


      if(sort === "rating"){

        return (
          Number(b.note || 0) -
          Number(a.note || 0)
        );

      }


      if(sort === "progress"){

        return (
          Number(b.progress || 0) -
          Number(a.progress || 0)
        );

      }


      if(sort === "time"){

        return (
          (
            Number(b.hours || 0) * 60 +
            Number(b.minutes || 0)
          )
          -

          (
            Number(a.hours || 0) * 60 +
            Number(a.minutes || 0)
          )
        );

      }


      return (
        Number(b.addedAt || 0) -
        Number(a.addedAt || 0)
      );

    }
  );


  document
    .getElementById(
      "libraryCount"
    )
    .textContent =
      `${items.length} jeu(x) dans ta bibliothèque`;


  if(!items.length){

    container.innerHTML =
      '<div class="empty">📚 Aucun jeu trouvé.</div>';

    return;

  }


  container.innerHTML = "";


  items.forEach(game => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "library-item";


    const minutes =
      Number(game.hours || 0) * 60 +
      Number(game.minutes || 0);


    item.innerHTML = `

      <img
        src="${escapeHtml(
          game.background_image ||
          placeholder()
        )}"
        alt=""
        loading="lazy"
      >

      <div class="library-info">

        <div class="library-name">
          ${escapeHtml(
            game.name ||
            "Jeu"
          )}
        </div>

        <div class="library-small">
          ${escapeHtml(
            game.released ||
            "Date inconnue"
          )}
        </div>

        <div class="library-line">
          ⭐ ${Number(game.note || 0)}/10
          •
          📊 ${Number(game.progress || 0)}%
        </div>

        <div class="library-line">
          🕐 ${Math.floor(minutes / 60)}h
          ${minutes % 60}min
        </div>

        <div class="badge">
          ${escapeHtml(
            game.status ||
            "À jouer"
          )}
        </div>

      </div>


      <button
        class="library-delete"
        onclick="
          event.stopPropagation();
          deleteLibraryGame(
            ${Number(game.id)}
          )
        "
      >
        🗑️
      </button>

    `;


    item.onclick =
      () => openGame(game);


    container.appendChild(
      item
    );

  });

}

  wishlist =
    wishlist.filter(
      x =>
        Number(x.id) !==
        Number(id)
    );

  saveWishlist();

  renderWishlist();

}


function daysUntil(date){

  if(!date)
    return null;


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  const target =
    new Date(
      date +
      "T00:00:00"
    );


  if(
    isNaN(
      target.getTime()
    )
  )
    return null;


  return Math.ceil(
    (
      target -
      today
    ) /
    86400000
  );

}


function releaseLabel(game){

  if(
    game.tba ||
    !game.released
  ){

    return "📅 Date à confirmer";

  }


  const days =
    daysUntil(
      game.released
    );


  if(days === null)
    return "📅 Date inconnue";

  if(days < 0)
    return "🟢 Sorti";

  if(days === 0)
    return "🔥 Sortie aujourd'hui";

  if(days === 1)
    return "⏳ Sortie demain";


  return (
    `⏳ Sortie dans ${days} jours`
  );

}

async function fetchUpcomingPage(
  page = 1,
  append = false
){

  const container =
    document.getElementById(
      "upcoming"
    );

  const status =
    document.getElementById(
      "upcomingStatus"
    );

  const more =
    document.getElementById(
      "upcomingMore"
    );


  if(!append){

    container.innerHTML =
      '<div class="empty">📅 Chargement...</div>';

    upcomingPage =
      1;

  }


  status.textContent =
    append
      ? "Chargement de jeux supplémentaires..."
      : "Recherche des prochaines sorties...";


  const today =
    new Date();


  const from =
    today
      .toISOString()
      .slice(0,10);


  const future =
    new Date(today);


  future.setDate(
    future.getDate() +
    365
  );


  const to =
    future
      .toISOString()
      .slice(0,10);


  try{

    const response =
      await fetch(

        WORKER_URL +
        `/upcoming?from=${
          encodeURIComponent(from)
        }&to=${
          encodeURIComponent(to)
        }&page=${page}`

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !Array.isArray(
        data.results
      )
    ){

      throw new Error(
        data.error ||
        "Impossible de charger les sorties"
      );

    }


    if(!append){

      container.innerHTML = "";

    }


    data.results

      .filter(
        x =>
          x.released
      )

      .sort(
        (a,b) =>
          a.released.localeCompare(
            b.released
          )
      )

      .forEach(game => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "upcoming-card";


        card.innerHTML = `

          <img
            src="${escapeHtml(
              game.background_image ||
              placeholder()
            )}"
            alt=""
            loading="lazy"
          >

          <div class="upcoming-body">

            <div class="upcoming-name">
              ${escapeHtml(
                game.name ||
                "Jeu"
              )}
            </div>

            <div class="upcoming-date">
              📅 ${escapeHtml(
                game.released
              )}
            </div>

            <div class="countdown">
              ${releaseLabel(game)}
            </div>

          </div>

        `;


        card.onclick =
          () => openGame(game);


        container.appendChild(
          card
        );

      });


    upcomingHasMore =
      Boolean(data.next);

    upcomingPage =
      page;


    more.classList.toggle(
      "hidden",
      !upcomingHasMore
    );


    status.textContent =
      `${
        container.querySelectorAll(
          ".upcoming-card"
        ).length
      } prochaine(s) sortie(s) affichée(s).`;


    if(
      !container.querySelector(
        ".upcoming-card"
      )
    ){

      container.innerHTML =
        '<div class="empty">Aucune sortie trouvée.</div>';

    }


  }catch(error){

    console.error(error);

    status.textContent =
      "Erreur lors du chargement des sorties.";


    if(!append){

      container.innerHTML = `

        <div class="empty">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

    }

  }

}

  await fetchUpcomingPage(
    1,
    false
  );

}

  if(

  ){

    await fetchUpcomingPage(

    );

  }

}

async function fetchGenrePage(

){

  const container =
    document.getElementById(
      "genreGames"
    );

  const status =
    document.getElementById(
      "genreStatus"
    );

  const more =
    document.getElementById(
      "genreMore"
    );


  if(!append){

    container.innerHTML =
      '<div class="empty">🎭 Chargement des jeux...</div>';

    genreSeenIds =
      new Set();

  }


  status.textContent =
    `Recherche des jeux ${
      currentGenreLabel
    }...`;


  try{

    const response =
      await fetch(

        WORKER_URL +
        "/genre/" +
        encodeURIComponent(
          currentGenreSlug
        ) +
        "?page=" +
        page

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !Array.isArray(
        data.results
      )
    ){

      throw new Error(
        data.error ||
        "Impossible de charger ce genre"
      );

    }


    if(!append){

      container.innerHTML = "";

    }


    data.results.forEach(
      game => {

        const id =

          genreSeenIds.has(id)
        )
          return;


        genreSeenIds.add(id);


        container.appendChild(
          createGameCard(game)
        );

      }
    );


    genreHasMore =
      Boolean(data.next);

    genrePage =
      page;


    more.classList.toggle(
      "hidden",
      !genreHasMore
    );


    status.textContent =
      `${
        container.querySelectorAll(
          ".card"
        ).length
      } jeu(x) affiché(s) dans ${
        currentGenreLabel
      }.`;



    if(
      !container.querySelector(
        ".card"
      )
    ){

      container.innerHTML =
        '<div class="empty">Aucun jeu trouvé dans ce genre RAWG.</div>';

    }


  }catch(error){

    status.textContent =

  }

/* =========================================================
   NAVIGATION
========================================================= */

function hideSections(){

  [
    "searchSection",
    "detailSection",
    "studioSection",
    "librarySection",
    "wishlistSection",
    "upcomingSection",
    "genresSection",
    "statsSection"
  ]
  .forEach(
    id =>
      document
        .getElementById(id)
        ?.classList
        .add("hidden")
  );


  [
    "tabSearch",
    "tabLibrary",
    "tabWishlist",
    "tabUpcoming",
    "tabGenres",
    "tabStats"
  ]
  .forEach(
    id =>
      document
        .getElementById(id)
        ?.classList
        .remove("active")
  );

}


function showSearch(){

  hideSections();

  document
    .getElementById(
      "searchSection"
    )
    .classList.remove(
      "hidden"
    );

  document
    .getElementById(
      "tabSearch"
    )
    .classList.add(
      "active"
    );

}

/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    "searchInput"
  )
