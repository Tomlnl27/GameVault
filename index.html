```html
<!DOCTYPE html>
<html lang="fr">
<head>

<style>
* {
    box-sizing: border-box;

body {
    margin: 0;
    background: #0b0b0f;

.stat-icon {
    font-size: 25px;

}

.stat-number {
    font-size: 26px;

}

.stat-label {
    color: #888894;
    margin-top: 5px;
    font-size: 14px;
}

.stats-section {
    background: #15151c;
    border: 1px solid #292934;
    border-radius: 15px;

}

.stats-section h3 {
    margin-top: 0;
}

.big-stat {
    font-size: 32px;
    font-weight: 800;
}

.best-game img {

}

.stat-list {

.stat-row:last-child {

@media (max-width: 800px) {

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);

}

@media (max-width: 600px) {

    .search {
        flex-direction: column;

        flex-direction: column;

</head>

<body>

<header>

    <div class="logo">
        🎮 GameVault
    </div>

    <div class="subtitle">
        Ta bibliothèque gaming
    </div>

</header>


<nav>

    <button
        id="searchTab"
        class="active"
        onclick="showSearch()">
        🔎 Recherche
    </button>

    <button
        id="libraryTab"
        onclick="showLibrary()">
        📚 Ma bibliothèque
    </button>

    <button
        id="statsTab"
        onclick="showStats()">
        📊 Statistiques
    </button>

</nav>


<main>


<section id="searchSection">

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Rechercher un jeu..."
        >

        <button onclick="searchGames()">
            Rechercher
        </button>

    </div>

    <div
        id="status"
        class="status">
        Recherche ton premier jeu 🎮
    </div>

    <div
        id="games"
        class="games">
    </div>

</section>


<section
    id="detailSection"
    class="hidden">

    <button
        class="back"
        onclick="backToSearch()">
        ← Retour
    </button>

    <br><br>

    <div
        id="detail"
        class="detail">
    </div>

</section>


<section
    id="librarySection"
    class="hidden">

    <h2>
        📚 Ma bibliothèque
    </h2>

    <div class="library-tools">

        <input
            id="librarySearch"
            type="text"
            placeholder="🔎 Rechercher dans ma bibliothèque..."
            oninput="renderLibrary()"
        >

        <select
            id="statusFilter"
            onchange="renderLibrary()">

            <option value="Tous">
                Tous les statuts
            </option>

            <option value="À jouer">
                À jouer
            </option>

            <option value="En cours">
                En cours
            </option>

            <option value="Terminé">
                Terminé
            </option>

        </select>

        <select
            id="sortFilter"
            onchange="renderLibrary()">

            <option value="recent">
                Plus récent
            </option>

            <option value="name">
                Nom A → Z
            </option>

            <option value="rating">
                Meilleure note
            </option>

            <option value="progress">
                Progression
            </option>

            <option value="time">
                Temps de jeu
            </option>

        </select>

    </div>

    <div
        id="libraryCount"
        class="library-count">
    </div>

    <div id="library"></div>

</section>


<section
    id="statsSection"
    class="hidden">

    <h2>
        📊 Mes statistiques
    </h2>

    <div
        id="statsContent">
    </div>

</section>


</main>


<script>

const WORKER_URL =
    "https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;

let library =
    JSON.parse(
        localStorage.getItem(
            "gamevault_library"
        )
    ) || [];


async function searchGames() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const gamesContainer =
        document.getElementById(
            "games"
        );

    const status =
        document.getElementById(
            "status"
        );

    const query =
        input.value.trim();

    if (!query) {

        status.textContent =
            "Écris le nom d'un jeu.";

        return;

    }

    status.textContent =
        "Recherche en cours...";

    gamesContainer.innerHTML = "";

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/search?q=" +
                encodeURIComponent(query)
            );

        if (!response.ok) {

            throw new Error(
                "Erreur serveur"
            );

        }

        const data =
            await response.json();

        if (
            !data.results ||
            data.results.length === 0
        ) {

            gamesContainer.innerHTML =
                '<div class="empty">Aucun jeu trouvé.</div>';

            status.textContent =
                "Aucun résultat.";

            return;

        }

        status.textContent =
            data.results.length +
            " résultat(s) trouvé(s).";

        data.results.forEach(
            game => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";

                const image =
                    game.background_image ||
                    "https://via.placeholder.com/300x450?text=No+Image";

                card.innerHTML = `

                    <img
                        src="${image}"
                        alt=""
                    >

                    <div class="card-content">

                        <h3>
                            ${escapeHtml(
                                game.name ||
                                "Jeu sans nom"
                            )}
                        </h3>

                        <div class="date">
                            ${
                                game.released ||
                                "Date inconnue"
                            }
                        </div>

                    </div>

                `;

                card.onclick =
                    () => openGame(game);

                gamesContainer.appendChild(
                    card
                );

            }
        );

    } catch (error) {

        console.error(error);

        status.textContent =
            "Impossible de contacter le serveur.";

        gamesContainer.innerHTML = `
            <div class="empty">
                Erreur lors de la recherche.
            </div>
        `;

    }

}


function openGame(game) {

    currentGame = game;

    hideAllSections();

    document
        .getElementById(
            "detailSection"
        )
        .classList.remove(
            "hidden"
        );

    renderDetail();

}


function renderDetail() {

    if (!currentGame) return;

    const detail =
        document.getElementById(
            "detail"
        );

    const image =
        currentGame.background_image ||
        "https://via.placeholder.com/300x450?text=No+Image";

    const platforms =
        currentGame.platforms
        ?
        currentGame.platforms
            .map(
                p => p.platform.name
            )
            .join(", ")
        :
        "Inconnues";

    const savedGame =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );

    const alreadyAdded =
        Boolean(savedGame);

    const personalRating =
        savedGame
        ?
        savedGame.note
        :
        0;

    const playHours =
        savedGame
        ?
        savedGame.hours
        :
        0;

    const playMinutes =
        savedGame
        ?
        savedGame.minutes
        :
        0;

    const progress =
        savedGame
        ?
        savedGame.progress
        :
        0;

    detail.innerHTML = `

        <div class="detail-top">

            <img
                class="detail-cover"
                src="${image}"
                alt=""
            >

            <div>

                <h1>
                    ${escapeHtml(
                        currentGame.name ||
                        "Jeu"
                    )}
                </h1>

                <div class="info">

                    <strong>
                        Date de sortie :
                    </strong>

                    ${
                        currentGame.released ||
                        "Inconnue"
                    }

                    <br>

                    <strong>
                        Note RAWG :
                    </strong>

                    ${
                        currentGame.rating ||
                        "N/A"
                    } / 5

                    <br>

                    <strong>
                        Plateformes :
                    </strong>

                    ${escapeHtml(platforms)}

                    <br>

                    <strong>
                        Genres :
                    </strong>

                    ${
                        currentGame.genres
                        ?
                        currentGame.genres
                            .map(
                                g => g.name
                            )
                            .join(", ")
                        :
                        "Inconnus"
                    }

                </div>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                ⭐ Ma note
            </div>

            <div class="rating-value">

                <span id="ratingValue">
                    ${personalRating}
                </span>
                / 10

            </div>

            <div class="rating-controls">

                <button
                    id="minusRating"
                    onclick="changeRating(-0.5)">
                    −
                </button>

                <span>
                    Par 0,5
                </span>

                <button
                    id="plusRating"
                    onclick="changeRating(0.5)">
                    +
                </button>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                🕐 Temps de jeu
            </div>

            <div class="playtime">

                <input
                    id="hoursInput"
                    type="number"
                    min="0"
                    value="${playHours}"
                    placeholder="Heures"
                >

                <input
                    id="minutesInput"
                    type="number"
                    min="0"
                    max="59"
                    value="${playMinutes}"
                    placeholder="Minutes"
                >

            </div>

            <button
                class="save-button"
                onclick="savePlaytime()">

                💾 Enregistrer

            </button>

        </div>


        <div class="panel">

            <div class="panel-title">
                📊 Progression
            </div>

            <div class="progress-value">

                <span id="progressValue">
                    ${progress}
                </span>%

            </div>

            <input
                id="progressSlider"
                class="progress-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="${progress}"
                oninput="updateProgress(this.value)"
            >

        </div>


        <div class="panel">

            <div class="panel-title">
                🎮 Statut
            </div>

            <select
                onchange="changeStatus(
                    ${currentGame.id},
                    this.value
                )">

                <option
                    ${
                        savedGame?.status ===
                        "À jouer"
                        ? "selected"
                        : ""
                    }>
                    À jouer
                </option>

                <option
                    ${
                        savedGame?.status ===
                        "En cours"
                        ? "selected"
                        : ""
                    }>
                    En cours
                </option>

                <option
                    ${
                        savedGame?.status ===
                        "Terminé"
                        ? "selected"
                        : ""
                    }>
                    Terminé
                </option>

            </select>

        </div>


        <div class="actions">

            ${
                alreadyAdded
                ?
                `<button class="add">
                    ✅ Dans ma bibliothèque
                </button>`
                :
                `<button
                    class="add"
                    onclick="addToLibrary()">

                    ➕ Ajouter à ma bibliothèque

                </button>`
            }

            ${
                alreadyAdded
                ?
                `<button
                    class="delete"
                    onclick="deleteGame(
                        ${currentGame.id}
                    )">

                    🗑️ Supprimer

                </button>`
                :
                ""
            }

        </div>

    `;

    updateRatingButtons();

}


function ensureGameInLibrary() {

    if (!currentGame) return null;

    let game =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );

    if (!game) {

        game = {

            id:
                currentGame.id,

            name:
                currentGame.name,

            background_image:
                currentGame.background_image,

            released:
                currentGame.released,

            status:
                "À jouer",

            note:
                0,

            progress:
                0,

            hours:
                0,

            minutes:
                0,

            addedAt:
                Date.now()

        };

        library.push(game);

        saveLibrary();

    }

    return game;

}


function addToLibrary() {

    ensureGameInLibrary();

    renderDetail();

}


function changeRating(amount) {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    let newRating =
        Number(game.note || 0) +
        amount;

    newRating =
        Math.round(
            newRating * 2
        ) / 2;

    newRating =
        Math.max(
            0,
            Math.min(
                10,
                newRating
            )
        );

    game.note =
        newRating;

    saveLibrary();

    renderDetail();

}


function updateRatingButtons() {

    const game =
        library.find(
            item =>
                item.id ===
                currentGame.id
        );

    if (!game) return;

    const minus =
        document.getElementById(
            "minusRating"
        );

    const plus =
        document.getElementById(
            "plusRating"
        );

    if (minus) {

        minus.disabled =
            game.note <= 0;

    }

    if (plus) {

        plus.disabled =
            game.note >= 10;

    }

}


function savePlaytime() {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    let hours =
        Number(
            document.getElementById(
                "hoursInput"
            ).value
        );

    let minutes =
        Number(
            document.getElementById(
                "minutesInput"
            ).value
        );

    if (
        isNaN(hours) ||
        hours < 0
    ) {

        hours = 0;

    }

    if (
        isNaN(minutes) ||
        minutes < 0
    ) {

        minutes = 0;

    }

    hours =
        Math.floor(hours);

    minutes =
        Math.floor(minutes);

    hours +=
        Math.floor(
            minutes / 60
        );

    minutes =
        minutes % 60;

    game.hours =
        hours;

    game.minutes =
        minutes;

    saveLibrary();

    renderDetail();

}


function updateProgress(value) {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    const progress =
        Number(value);

    game.progress =
        progress;

    const display =
        document.getElementById(
            "progressValue"
        );

    if (display) {

        display.textContent =
            progress;

    }

    saveLibrary();

}


function deleteGame(id) {

    const game =
        library.find(
            item =>
                item.id === id
        );

    if (!game) return;

    const confirmed =
        confirm(
            `Supprimer "${game.name}" de ta bibliothèque ?`
        );

    if (!confirmed) return;

    library =
        library.filter(
            item =>
                item.id !== id
        );

    saveLibrary();

    showLibrary();

}


function saveLibrary() {

    localStorage.setItem(
        "gamevault_library",
        JSON.stringify(
            library
        )
    );

}


function hideAllSections() {

    document
        .getElementById(
            "searchSection"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "detailSection"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "librarySection"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "statsSection"
        )
        .classList.add(
            "hidden"
        );

}


function resetTabs() {

    document
        .getElementById(
            "searchTab"
        )
        .classList.remove(
            "active"
        );

    document
        .getElementById(
            "libraryTab"
        )
        .classList.remove(
            "active"
        );

    document
        .getElementById(
            "statsTab"
        )
        .classList.remove(
            "active"
        );

}


function showSearch() {

    hideAllSections();

    resetTabs();

    document
        .getElementById(
            "searchSection"
        )
        .classList.remove(
            "hidden"
        );

    document
        .getElementById(
            "searchTab"
        )
        .classList.add(
            "active"
        );

}


function showLibrary() {

    hideAllSections();

    resetTabs();

    document
        .getElementById(

function renderLibrary() {

    const container =
        document.getElementById(
            "library"
        );

    const searchInput =
        document.getElementById(
            "librarySearch"
        );

    const statusFilter =
        document.getElementById(
            "statusFilter"
        );

    const sortFilter =
        document.getElementById(
            "sortFilter"
        );

    const query =
        searchInput
        ?
        searchInput.value
            .trim()
            .toLowerCase()
        :
        "";

    const selectedStatus =
        statusFilter
        ?
        statusFilter.value
        :
        "Tous";

    const selectedSort =
        sortFilter
        ?
        sortFilter.value
        :
        "recent";


    let filtered =
        library.filter(
            game => {

                const matchesName =
                    game.name
                        .toLowerCase()
                        .includes(
                            query
                        );

                const matchesStatus =
                    selectedStatus ===
                    "Tous" ||
                    game.status ===
                    selectedStatus;

                return (
                    matchesName &&
                    matchesStatus
                );

            }
        );


    filtered.sort(
        (a, b) => {

            if (
                selectedSort ===
                "name"
            ) {

                return a.name.localeCompare(
                    b.name
                );

            }

            if (
                selectedSort ===
                "rating"
            ) {

                return (
                    (b.note || 0) -
                    (a.note || 0)
                );

            }

            if (
                selectedSort ===
                "progress"
            ) {

                return (
                    (b.progress || 0) -
                    (a.progress || 0)
                );

            }

            if (
                selectedSort ===
                "time"
            ) {

                const timeA =
                    (a.hours || 0) * 60 +
                    (a.minutes || 0);

                const timeB =
                    (b.hours || 0) * 60 +
                    (b.minutes || 0);

                return timeB - timeA;

            }

            return (
                (b.addedAt || 0) -
                (a.addedAt || 0)
            );

        }
    );


    const count =
        document.getElementById(
            "libraryCount"
        );

    if (count) {

        count.textContent =
            `${filtered.length} jeu(x) affiché(s) sur ${library.length}`;

    }


    if (
        filtered.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">Aucun jeu ne correspond à ta recherche.</div>';

        return;

    }


    container.innerHTML = "";


    filtered.forEach(
        game => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "library-item";

            const image =
                game.background_image ||
                "https://via.placeholder.com/100x150?text=No+Image";


            const playtime =
                game.hours > 0 ||
                game.minutes > 0
                ?
                `${game.hours} h ${game.minutes} min`
                :
                "Aucun temps enregistré";


            item.innerHTML = `

                <img
                    src="${image}"
                    alt=""
                >

                <div class="library-info">

                    <strong>
                        ${escapeHtml(
                            game.name
                        )}
                    </strong>

                    <br>

                    <small>
                        ${
                            game.released ||
                            ""
                        }
                    </small>

                    <div class="library-rating">

                        ⭐
                        ${
                            game.note > 0
                            ?
                            game.note +
                            " / 10"
                            :
                            "Pas encore noté"
                        }

                    </div>

                    <div class="library-progress">

                        📊
                        ${
                            game.progress ||
                            0
                        }%

                    </div>

                    <div class="library-time">

                        🕐
                        ${playtime}

                    </div>

                    <div class="status-badge">

                        ${escapeHtml(
                            game.status ||
                            "À jouer"
                        )}

                    </div>

                </div>

            `;


            item.onclick =
                () => openSavedGame(
                    game
                );


            container.appendChild(
                item
            );

        }
    );

}


async function openSavedGame(game) {

    currentGame =
        game;

    hideAllSections();

    document
        .getElementById(
            "detailSection"
        )
        .classList.remove(
            "hidden"
        );


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/game/" +
                game.id
            );

        if (
            response.ok
        ) {

            const freshGame =
                await response.json();

            currentGame = {
                ...game,
                ...freshGame
            };

        }

    } catch (error) {

        console.log(
            "Infos détaillées indisponibles"
        );

    }

    renderDetail();

}


function changeStatus(
    id,
    status
) {

    let game =
        library.find(
            item =>
                item.id === id
        );

    if (!game) {

        game =
            ensureGameInLibrary();

    }

    if (!game) return;

    game.status =
        status;

    saveLibrary();

    renderDetail();

}


function renderStats() {

    const container =
        document.getElementById(
            "statsContent"
        );

    const total =
        library.length;

    const toPlay =
        library.filter(
            game =>
                game.status ===
                "À jouer"
        ).length;

    const inProgress =
        library.filter(
            game =>
                game.status ===
                "En cours"
        ).length;

    const completed =
        library.filter(
            game =>
                game.status ===
                "Terminé"
        ).length;


    const ratedGames =
        library.filter(
            game =>
                Number(game.note) > 0
        );


    const averageRating =
        ratedGames.length > 0
        ?
        (
            ratedGames.reduce(
                (sum, game) =>
                    sum +
                    Number(game.note),
                0
            ) /
            ratedGames.length
        ).toFixed(1)
        :
        "—";


    const totalMinutes =
        library.reduce(
            (sum, game) =>
                sum +
                (
                    Number(game.hours || 0) *
                    60
                ) +
                Number(game.minutes || 0),
            0
        );


    const totalHours =
        Math.floor(
            totalMinutes / 60
        );

    const remainingMinutes =
        totalMinutes % 60;


    const averageProgress =
        total > 0
        ?
        Math.round(
            library.reduce(
                (sum, game) =>
                    sum +
                    Number(
                        game.progress || 0
                    ),
                0
            ) / total
        )
        :
        0;


    const completionRate =

        )

    const bestRated =

    const mostPlayed =

        ?

                const timeA =
                    Number(a.hours || 0) *
                    60 +
                    Number(a.minutes || 0);

                const timeB =
                    Number(b.hours || 0) *
                    60 +
                    Number(b.minutes || 0);

                return timeB - timeA;

            }
        )[0]
        :
        null;


    const totalRated =
        ratedGames.length;


    let ratingSection = "";

    if (bestRated) {

        ratingSection = `

            <div class="stats-section">

                    ⭐ Jeu le mieux noté
                </h3>

                <div class="best-game">

                        </strong>

                        <div class="big-stat">

                            ${bestRated.note}
                            / 10

                        </div>

                    </div>

                </div>

            </div>

        `;

    } else {

        ratingSection = `

            <div class="stats-section">

                <h3>
                    ⭐ Notes
                </h3>

                <div class="small-text">

                    Note un jeu pour commencer
                    à remplir tes statistiques.

                </div>

            </div>

        `;

    }


    let playedSection = "";

    if (
        mostPlayed &&
        (
            Number(mostPlayed.hours || 0) >
            0 ||
            Number(mostPlayed.minutes || 0) >
            0
        )
    ) {

        playedSection = `

            <div class="stats-section">

                <h3>
                    🕐 Jeu le plus joué
                </h3>

                <div class="best-game">

                    <img
                        src="${
                            mostPlayed.background_image ||
                            "https://via.placeholder.com/100x150?text=No+Image"
                        }"
                        alt=""
                    >

                    <div class="best-game-info">

                        <strong>
                            ${escapeHtml(
                                mostPlayed.name
                            )}
                        </strong>

                        <div class="big-stat">

                            ${
                                mostPlayed.hours ||
                                0
                            } h ${
                                mostPlayed.minutes ||
                                0
                            } min

                        </div>

                    </div>

                </div>

            </div>

        `;

    }


    container.innerHTML = `

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    🎮
                </div>

                <div class="stat-number">
                    ${total}
                </div>

                    Jeux dans la bibliothèque
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🏆
                </div>

                <div class="stat-number">
                    ${completed}
                </div>

                <div class="stat-label">
                    Jeux terminés
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⭐
                </div>

                <div class="stat-number">
                    ${averageRating}
                </div>

                <div class="stat-label">
                    Note moyenne
                </div>

            </div>


            <div class="stat-card">

                    🕐

                </div>

                <div class="stat-label">

            </div>

        </div>


        <div class="stats-section">

function escapeHtml(text) {

        document.createElement(

    div.textContent =
