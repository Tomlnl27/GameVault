<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 18px;
    background: #111118;
    border-bottom: 1px solid #24242d;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    color: #888894;
    margin-top: 5px;
}

nav {
    display: flex;
    gap: 10px;
    padding: 15px 18px;
    background: #111118;
}

nav button {
    background: #1b1b23;
    color: white;
    border: 1px solid #2b2b35;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
}

nav button.active {
    background: white;
    color: black;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search input {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #30303a;
    background: #17171f;
    color: white;
    font-size: 16px;
}

.search button {
    padding: 14px 18px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: 700;
    cursor: pointer;
}

.status {
    color: #8f8f9b;
    margin-bottom: 18px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
}

.card {
    background: #15151c;
    border: 1px solid #24242d;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
}

.card:hover {
    transform: translateY(-3px);
}

.card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.card-content {
    padding: 12px;
}

.card h3 {
    margin: 0 0 8px;
    font-size: 16px;
}

.date {
    color: #8d8d99;
    font-size: 13px;
}

.empty {
    color: #777783;
    text-align: center;
    padding: 50px 10px;
}

.hidden {
    display: none;
}

.detail {
    background: #15151c;
    border: 1px solid #292934;
    border-radius: 18px;
    padding: 20px;
}

.detail-top {
    display: flex;
    gap: 25px;
}

.detail-cover {
    width: 260px;
    max-width: 40%;
    border-radius: 14px;
    object-fit: cover;
}

.detail h1 {
    margin-top: 0;
}

.info {
    color: #b0b0ba;
    line-height: 1.6;
}

.actions {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.actions button {
    padding: 12px 16px;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    font-weight: 700;
}

.add {
    background: white;
    color: black;
}

.back {
    background: #292933;
    color: white;
}

.panel {
    margin-top: 22px;
    padding: 16px;
    background: #101016;
    border-radius: 14px;
    border: 1px solid #292934;
}

.panel-title {
    color: #aaaab5;
    margin-bottom: 10px;
}

.rating-value {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
}

.rating-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.rating-controls button {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid #33333d;
    background: #20202a;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.rating-controls button:disabled {
    opacity: 0.35;
    cursor: default;
}

.playtime {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.playtime input {
    width: 100px;
    padding: 10px;
    border-radius: 9px;
    border: 1px solid #33333d;
    background: #20202a;
    color: white;
}

.save-button {
    margin-top: 12px;
    padding: 10px 15px;
    border: 0;
    border-radius: 9px;
    background: white;
    color: black;
    font-weight: 700;
    cursor: pointer;
}

.progress-value {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 10px;
}

.progress-slider {
    width: 100%;
    cursor: pointer;
}

.library-item {
    display: flex;
    gap: 15px;
    align-items: center;
    padding: 12px;
    margin-bottom: 10px;
    background: #15151c;
    border: 1px solid #24242d;
    border-radius: 12px;
}

.library-item img {
    width: 60px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}

.library-info {
    flex: 1;
}

.library-rating,
.library-progress,
.library-time {
    margin-top: 6px;
    font-weight: 700;
}

select {
    background: #20202a;
    color: white;
    border: 1px solid #33333e;
    border-radius: 8px;
    padding: 8px;
}

@media (max-width: 600px) {

    .search {
        flex-direction: column;
    }

    .detail-top {
        flex-direction: column;
    }

    .detail-cover {
        max-width: 100%;
        width: 220px;
    }

    .library-item {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 GameVault</div>
    <div class="subtitle">Ta bibliothèque gaming</div>
</header>

<nav>

    <button id="searchTab"
            class="active"
            onclick="showSearch()">
        🔎 Recherche
    </button>

    <button id="libraryTab"
            onclick="showLibrary()">
        📚 Ma bibliothèque
    </button>

</nav>

<main>

<section id="searchSection">

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Rechercher un jeu..."
        >

        <button onclick="searchGames()">
            Rechercher
        </button>

    </div>

    <div id="status" class="status">
        Recherche ton premier jeu 🎮
    </div>

    <div id="games" class="games"></div>

</section>


<section id="detailSection" class="hidden">

    <button class="back"
            onclick="backToSearch()">
        ← Retour
    </button>

    <br><br>

    <div id="detail"
         class="detail">
    </div>

</section>


<section id="librarySection" class="hidden">

    <h2>📚 Ma bibliothèque</h2>

    <div id="library"></div>

</section>

</main>


<script>

const WORKER_URL =
    "https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;

let library =
    JSON.parse(
        localStorage.getItem("gamevault_library")
    ) || [];


async function searchGames() {

    const input =
        document.getElementById("searchInput");

    const gamesContainer =
        document.getElementById("games");

    const status =
        document.getElementById("status");

    const query =
        input.value.trim();

    if (!query) {

        status.textContent =
            "Écris le nom d'un jeu.";

        return;
    }

    status.textContent =
        "Recherche en cours...";

    gamesContainer.innerHTML = "";

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/search?q=" +
                encodeURIComponent(query)
            );

        if (!response.ok) {

            throw new Error(
                "Erreur serveur"
            );

        }

        const data =
            await response.json();

        if (!data.results ||
            data.results.length === 0) {

            gamesContainer.innerHTML =
                '<div class="empty">Aucun jeu trouvé.</div>';

            status.textContent =
                "Aucun résultat.";

            return;
        }

        status.textContent =
            data.results.length +
            " résultat(s) trouvé(s).";

        data.results.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "card";

            const image =
                game.background_image ||
                "https://via.placeholder.com/300x450?text=No+Image";

            card.innerHTML = `

                <img
                    src="${image}"
                    alt=""
                >

                <div class="card-content">

                    <h3>
                        ${escapeHtml(
                            game.name ||
                            "Jeu sans nom"
                        )}
                    </h3>

                    <div class="date">
                        ${
                            game.released ||
                            "Date inconnue"
                        }
                    </div>

                </div>

            `;

            card.onclick = () => {
                openGame(game);
            };

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        status.textContent =
            "Impossible de contacter le serveur.";

        gamesContainer.innerHTML = `
            <div class="empty">
                Erreur lors de la recherche.
            </div>
        `;

    }

}


function openGame(game) {

    currentGame = game;

    document
        .getElementById("searchSection")
        .classList.add("hidden");

    document
        .getElementById("librarySection")
        .classList.add("hidden");

    document
        .getElementById("detailSection")
        .classList.remove("hidden");

    renderDetail();

}


function renderDetail() {

    if (!currentGame) return;

    const detail =
        document.getElementById("detail");

    const image =
        currentGame.background_image ||
        "https://via.placeholder.com/300x450?text=No+Image";

    const platforms =
        currentGame.platforms
        ? currentGame.platforms
            .map(p => p.platform.name)
            .join(", ")
        : "Inconnues";

    const savedGame =
        library.find(
            item => item.id === currentGame.id
        );

    const alreadyAdded =
        Boolean(savedGame);

    const personalRating =
        savedGame
        ? savedGame.note
        : 0;

    const playHours =
        savedGame
        ? savedGame.hours
        : 0;

    const playMinutes =
        savedGame
        ? savedGame.minutes
        : 0;

    const progress =
        savedGame
        ? savedGame.progress
        : 0;

    detail.innerHTML = `

        <div class="detail-top">

            <img
                class="detail-cover"
                src="${image}"
                alt=""
            >

            <div>

                <h1>
                    ${escapeHtml(
                        currentGame.name ||
                        "Jeu"
                    )}
                </h1>

                <div class="info">

                    <strong>
                        Date de sortie :
                    </strong>

                    ${
                        currentGame.released ||
                        "Inconnue"
                    }

                    <br>

                    <strong>
                        Note RAWG :
                    </strong>

                    ${
                        currentGame.rating ||
                        "N/A"
                    } / 5

                    <br>

                    <strong>
                        Plateformes :
                    </strong>

                    ${escapeHtml(platforms)}

                    <br>

                    <strong>
                        Genres :
                    </strong>

                    ${
                        currentGame.genres
                        ? currentGame.genres
                            .map(g => g.name)
                            .join(", ")
                        : "Inconnus"
                    }

                </div>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                ⭐ Ma note
            </div>

            <div class="rating-value">

                <span id="ratingValue">
                    ${personalRating}
                </span>
                / 10

            </div>

            <div class="rating-controls">

                <button
                    id="minusRating"
                    onclick="changeRating(-0.5)">
                    −
                </button>

                <span>
                    Par 0,5
                </span>

                <button
                    id="plusRating"
                    onclick="changeRating(0.5)">
                    +
                </button>

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                🕐 Temps de jeu
            </div>

            <div class="playtime">

                <input
                    id="hoursInput"
                    type="number"
                    min="0"
                    value="${playHours}"
                    placeholder="Heures"
                >

                <input
                    id="minutesInput"
                    type="number"
                    min="0"
                    max="59"
                    value="${playMinutes}"
                    placeholder="Minutes"
                >

            </div>

            <button
                class="save-button"
                onclick="savePlaytime()">

                💾 Enregistrer

            </button>

        </div>


        <div class="panel">

            <div class="panel-title">
                📊 Progression
            </div>

            <div class="progress-value">

                <span id="progressValue">
                    ${progress}
                </span>%

            </div>

            <input
                id="progressSlider"
                class="progress-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="${progress}"
                oninput="updateProgress(this.value)"
            >

        </div>


        <div class="actions">

            ${
                alreadyAdded
                ?
                `<button class="add">
                    ✅ Dans ma bibliothèque
                </button>`
                :
                `<button
                    class="add"
                    onclick="addToLibrary()">

                    ➕ Ajouter à ma bibliothèque

                </button>`
            }

        </div>

    `;

    updateRatingButtons();

}


function ensureGameInLibrary() {

    if (!currentGame) return null;

    let game =
        library.find(
            item => item.id === currentGame.id
        );

    if (!game) {

        game = {

            id:
                currentGame.id,

            name:
                currentGame.name,

            background_image:
                currentGame.background_image,

            released:
                currentGame.released,

            status:
                "À jouer",

            note:
                0,

            progress:
                0,

            hours:
                0,

            minutes:
                0

        };

        library.push(game);

        saveLibrary();

    }

    return game;

}


function addToLibrary() {

    ensureGameInLibrary();

    renderDetail();

}


function changeRating(amount) {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    let newRating =
        Number(game.note || 0) + amount;

    newRating =
        Math.round(newRating * 2) / 2;

    newRating =
        Math.max(
            0,
            Math.min(10, newRating)
        );

    game.note =
        newRating;

    saveLibrary();

    renderDetail();

}


function updateRatingButtons() {

    const game =
        library.find(
            item => item.id === currentGame.id
        );

    if (!game) return;

    const minus =
        document.getElementById(
            "minusRating"
        );

    const plus =
        document.getElementById(
            "plusRating"
        );

    if (minus) {

        minus.disabled =
            game.note <= 0;

    }

    if (plus) {

        plus.disabled =
            game.note >= 10;

    }

}


function savePlaytime() {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    let hours =
        Number(
            document.getElementById(
                "hoursInput"
            ).value
        );

    let minutes =
        Number(
            document.getElementById(
                "minutesInput"
            ).value
        );

    if (isNaN(hours) || hours < 0) {
        hours = 0;
    }

    if (isNaN(minutes) || minutes < 0) {
        minutes = 0;
    }

    hours =
        Math.floor(hours);

    minutes =
        Math.floor(minutes);

    hours +=
        Math.floor(minutes / 60);

    minutes =
        minutes % 60;

    game.hours =
        hours;

    game.minutes =
        minutes;

    saveLibrary();

    renderDetail();

}


function updateProgress(value) {

    const game =
        ensureGameInLibrary();

    if (!game) return;

    const progress =
        Number(value);

    game.progress =
        progress;

    const display =
        document.getElementById(
            "progressValue"
        );

    if (display) {

        display.textContent =
            progress;

    }

    saveLibrary();

}


function saveLibrary() {

    localStorage.setItem(
        "gamevault_library",
        JSON.stringify(library)
    );

}


function showLibrary() {

    document
        .getElementById("searchSection")
        .classList.add("hidden");

    document
        .getElementById("detailSection")
        .classList.add("hidden");

    document
        .getElementById("librarySection")
        .classList.remove("hidden");

    document
        .getElementById("searchTab")
        .classList.remove("active");

    document
        .getElementById("libraryTab")
        .classList.add("active");

    renderLibrary();

}


function showSearch() {

    document
        .getElementById("librarySection")
        .classList.add("hidden");

    document
        .getElementById("detailSection")
        .classList.add("hidden");

    document
        .getElementById("searchSection")
        .classList.remove("hidden");

    document
        .getElementById("libraryTab")
        .classList.remove("active");

    document
        .getElementById("searchTab")
        .classList.add("active");

}


function backToSearch() {

    showSearch();

}


function renderLibrary() {

    const container =
        document.getElementById("library");

    if (library.length === 0) {

        container.innerHTML =
            '<div class="empty">Ta bibliothèque est vide 🎮</div>';

        return;

    }

    container.innerHTML = "";

    library.forEach(game => {

        const item =
            document.createElement("div");

        item.className =
            "library-item";

        const image =
            game.background_image ||
            "https://via.placeholder.com/100x150?text=No+Image";

        const playtime =
            game.hours > 0 ||
            game.minutes > 0
            ?
            `${game.hours} h ${game.minutes} min`
            :
            "Aucun temps enregistré";

        item.innerHTML = `

            <img
                src="${image}"
                alt=""
            >

            <div class="library-info">

                <strong>
                    ${escapeHtml(game.name)}
                </strong>

                <br>

                <small>
                    ${game.released || ""}
                </small>

                <div class="library-rating">

                    ⭐
                    ${
                        game.note > 0
                        ? game.note + " / 10"
                        : "Pas encore noté"
                    }

                </div>

                <div class="library-progress">

                    📊
                    ${game.progress || 0}%

                </div>

                <div class="library-time">

                    🕐
                    ${playtime}

                </div>

                <br>

                <select
                    onchange="changeStatus(
                        ${game.id},
                        this.value
                    )">

                    <option
                        ${
                            game.status === "À jouer"
                            ? "selected"
                            : ""
                        }>
                        À jouer
                    </option>

                    <option
                        ${
                            game.status === "En cours"
                            ? "selected"
                            : ""
                        }>
                        En cours
                    </option>

                    <option
                        ${
                            game.status === "Terminé"
                            ? "selected"
                            : ""
                        }>
                        Terminé
                    </option>

                </select>

            </div>

        `;

        container.appendChild(item);

    });

}


function changeStatus(id, status) {

    const game =
        library.find(
            game => game.id === id
        );

    if (!game) return;

    game.status =
        status;

    saveLibrary();

    renderLibrary();

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchGames();

            }

        }
    );

</script>

</body>
</html>
