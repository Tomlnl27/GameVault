<header>

id="librarySearch"

oninput="renderLibrary()"
>

<select id="statusFilter" onchange="renderLibrary()">
<option value="Tous">Tous les statuts</option>
<option value="À jouer">À jouer</option>
<option value="En cours">En cours</option>
<option value="Terminé">Terminé</option>
</select>

<option value="recent">Plus récent</option>
<option value="name">Nom A → Z</option>
<option value="rating">Meilleure note</option>

<option value="time">Temps de jeu</option>
</select>

</div>

</section>

<div id="statsContent"></div>

</section>

<script>

const WORKER_URL =
"https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;

let library =
JSON.parse(
localStorage.getItem("gamevault_library") || "[]"
);


/* =========================
   RECHERCHE
========================= */

async function searchGames(){

const input =
document.getElementById("searchInput");

const results =
document.getElementById("results");

const status =
document.getElementById("searchStatus");

const query =
input.value.trim();

if(query.length < 2){

status.textContent =
"Écris au moins 2 caractères.";

return;
}

status.textContent =
"Recherche en cours...";

results.innerHTML =
'<div class="empty">🔎 Recherche...</div>';

try{

const response =
await fetch(
WORKER_URL +
"/search?q=" +
encodeURIComponent(query)
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Erreur du Worker"
);

}

if(!data.results){

throw new Error(
"RAWG n'a pas renvoyé de résultats"
);

}

if(data.results.length === 0){

results.innerHTML =
'<div class="empty">Aucun jeu trouvé.</div>';

status.textContent =
"Aucun résultat.";

return;
}

status.textContent =
data.results.length +
" jeu(x) trouvé(s).";

results.innerHTML = "";

data.results.forEach(game=>{

const card =
document.createElement("div");

card.className = "card";

const image =
game.background_image ||
"";

card.innerHTML = `

<img
src="${image}"
alt=""
onerror="this.style.display='none'"
>

<div class="card-body">

<div class="card-title">
${escapeHtml(game.name)}
</div>

<div class="card-date">
${game.released || "Date inconnue"}
</div>

</div>

`;

card.onclick =
()=>openGame(game);

results.appendChild(card);

});

}catch(error){

console.error(error);

status.textContent =
"Erreur : " + error.message;

results.innerHTML =
`
<div class="empty">
❌ ${escapeHtml(error.message)}
</div>
`;

}

}


/* =========================
   OUVERTURE JEU
========================= */

async function openGame(game){

currentGame = game;

hideAll();

document
.getElementById("detailSection")
.classList.remove("hidden");

const detail =
document.getElementById("detail");

detail.innerHTML =
'<div class="empty">🎮 Chargement de la fiche...</div>';


try{

const url =
WORKER_URL +
"/game/" +
encodeURIComponent(game.id);

const response =
await fetch(url);


const text =
await response.text();


if(!response.ok){

throw new Error(
"Worker : " +
response.status +
" — " +
text
);

}


let data;

try{

data =
JSON.parse(text);

}catch{

throw new Error(
"Le Worker n'a pas renvoyé du JSON."
);

}


if(data.error){

throw new Error(
data.error
);

}


/*
   On combine les données
   de recherche + fiche détaillée
*/

currentGame = {
...game,
...data
};

renderGame(currentGame);


}catch(error){

console.error(error);

detail.innerHTML = `

<div class="empty">

<h2>❌ Impossible de charger la fiche</h2>

<p>
${escapeHtml(error.message)}
</p>

<p>
Le Worker répond, mais la fiche détaillée
n'a pas pu être récupérée.
</p>

<button
class="primary"
onclick="showSearch()"
style="padding:12px 16px;border-radius:10px;border:0;font-weight:800"
>
← Retour à la recherche
</button>

</div>

`;

}

}


/* =========================
   AFFICHAGE FICHE
========================= */

function renderGame(game){

const detail =
document.getElementById("detail");

const saved =
library.find(
item=>item.id===game.id
);

const image =
game.background_image ||
"";

const description =
game.description_raw ||
cleanDescription(game.description) ||
"Aucune description disponible.";

const developers =
Array.isArray(game.developers) &&
game.developers.length
?
game.developers
.map(x=>x.name)
.filter(Boolean)
.join(", ")
:
"Non renseigné";

const publishers =
Array.isArray(game.publishers) &&
game.publishers.length
?
game.publishers
.map(x=>x.name)
.filter(Boolean)
.join(", ")
:
"Non renseigné";

const genres =
Array.isArray(game.genres) &&
game.genres.length
?
game.genres
.map(x=>x.name)
.filter(Boolean)
.join(", ")
:
"Non renseigné";

const platforms =
Array.isArray(game.platforms) &&
game.platforms.length
?
game.platforms
.map(x=>
x.platform?.name || x.name
)
.filter(Boolean)
.join(", ")
:
"Non renseignées";

const note =
saved
?
Number(saved.note || 0)
:
0;

const progress =
saved
?
Number(saved.progress || 0)
:
0;

const hours =
saved
?
Number(saved.hours || 0)
:
0;

const minutes =
saved
?
Number(saved.minutes || 0)
:
0;

const status =
saved
?
saved.status
:
"À jouer";


detail.innerHTML = `

<div class="detail">

<div class="detail-header">

<div>

<img
class="cover"
src="${image}"
alt=""
>

</div>

<div>

<h1>
${escapeHtml(game.name || "Jeu")}
</h1>

<div class="release">
📅 ${game.released || "Date inconnue"}
</div>

<div class="description">
${escapeHtml(description)}
</div>

<div class="meta">

<div class="meta-box">
<div class="meta-label">
🛠️ DÉVELOPPEUR
</div>
<div class="meta-value">
${escapeHtml(developers)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">
🏢 ÉDITEUR
</div>
<div class="meta-value">
${escapeHtml(publishers)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">
🎭 GENRES
</div>
<div class="meta-value">
${escapeHtml(genres)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">
🎮 PLATEFORMES
</div>
<div class="meta-value">
${escapeHtml(platforms)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">
⭐ NOTE RAWG
</div>
<div class="meta-value">
${game.rating
?
game.rating + " / 5"
:
"Non renseignée"}
</div>
</div>

<div class="meta-box">
<div class="meta-label">
👥 AVIS
</div>
<div class="meta-value">
${game.ratings_count || "Non renseigné"}
</div>
</div>

</div>

</div>

</div>


<div class="panel">

<div class="panel-title">
⭐ Ma note
</div>

<div class="rating">

<span id="ratingValue">
${note}
</span>

/ 10

</div>

<div class="rating-controls">

<button
id="minusRating"
onclick="changeRating(-0.5)"
>
−
</button>

<span>Pas de 0,5</span>

<button
id="plusRating"
onclick="changeRating(0.5)"
>
+
</button>

</div>

</div>


<div class="panel">

<div class="panel-title">
📊 Progression
</div>

<div class="progress-number">

<span id="progressValue">
${progress}
</span>%

</div>

<input
class="slider"
type="range"
min="0"
max="100"
step="1"
value="${progress}"
oninput="changeProgress(this.value)"
>

</div>


<div class="panel">

<div class="panel-title">
🕐 Temps de jeu
</div>

<div class="time">

<input
id="hoursInput"
type="number"
min="0"
value="${hours}"
placeholder="Heures"
>

<input
id="minutesInput"
type="number"
min="0"
max="59"

placeholder="Minutes"
>

<button
class="primary"
onclick="saveTime()"
style="padding:10px 14px;border:0;border-radius:9px;font-weight:800"
>
Enregistrer
</button>

</div>

</div>


<div class="panel">

<div class="panel-title">
🎯 Statut
</div>

<select
id="statusSelect"
onchange="changeStatus(this.value)"
>

<option
value="À jouer"
${status==="À jouer"?"selected":""}
>
À jouer
</option>

<option
value="En cours"
${status==="En cours"?"selected":""}
>
En cours
</option>

<option
value="Terminé"
${status==="Terminé"?"selected":""}
>
Terminé
</option>

</select>

</div>


<div class="actions">

${
saved
?
`
<button
class="secondary"
disabled
>
✅ Dans ma bibliothèque
</button>

<button
class="danger"
onclick="deleteCurrentGame()"
>
🗑️ Supprimer
</button>
`
:
`
<button
class="primary"
onclick="addCurrentGame()"
>
➕ Ajouter à ma bibliothèque
</button>
`
}

</div>

</div>
`;

updateRatingButtons();

}


/* =========================
   BIBLIOTHÈQUE
========================= */

function getSaved(){

return currentGame
?
library.find(
x=>x.id===currentGame.id
)
:
null;

}


function ensureSaved(){

let game =
getSaved();

if(game)
return game;

game = {

id:currentGame.id,

name:currentGame.name,

background_image:
currentGame.background_image,

released:
currentGame.released,

note:0,

progress:0,

hours:0,

minutes:0,

status:"À jouer",

addedAt:Date.now()

};

library.push(game);

saveLibrary();

return game;

}


function addCurrentGame(){

ensureSaved();

renderGame(currentGame);

}


function changeRating(amount){

const game =
ensureSaved();

let value =
Number(game.note || 0) +
amount;

value =
Math.round(value*2)/2;

value =
Math.max(
0,
Math.min(
10,
value
)
);

game.note =
value;

saveLibrary();

document
.getElementById("ratingValue")
.textContent =
value;

updateRatingButtons();

}


function updateRatingButtons(){

const game =
getSaved();

if(!game)
return;

const minus =
document.getElementById(
"minusRating"
);

const plus =
document.getElementById(
"plusRating"
);

if(minus)
minus.disabled =
game.note<=0;

if(plus)
plus.disabled =
game.note>=10;

}


function changeProgress(value){

const game =
ensureSaved();

game.progress =
Number(value);

const display =
document.getElementById(
"progressValue"
);

if(display)
display.textContent =
value;

saveLibrary();

}


function saveTime(){

const game =
ensureSaved();

let hours =
parseInt(
document.getElementById(
"hoursInput"
).value
) || 0;

let minutes =
parseInt(
document.getElementById(
"minutesInput"
).value
) || 0;

hours +=
Math.floor(minutes/60);

minutes =
minutes%60;

game.hours =
hours;

game.minutes =
minutes;

saveLibrary();

renderGame(currentGame);

}


function changeStatus(value){

const game =
ensureSaved();

game.status =
value;

saveLibrary();

renderGame(currentGame);

}


function deleteCurrentGame(){

if(!currentGame)
return;

if(
!confirm(
"Supprimer ce jeu de ta bibliothèque ?"
)
)
return;

library =
library.filter(
x=>x.id!==currentGame.id
);

saveLibrary();

showLibrary();

}


function saveLibrary(){

localStorage.setItem(
"gamevault_library",
JSON.stringify(library)
);

}


/* =========================
   AFFICHER BIBLIOTHÈQUE
========================= */

function renderLibrary(){

const container =
document.getElementById(
"library"
);

const search =
(
document.getElementById(
"librarySearch"
).value || ""
)
.toLowerCase();

const status =
document.getElementById(
"statusFilter"
).value;

const sort =
document.getElementById(
"sortFilter"
).value;

let games =
library.filter(game=>{

const name =
(game.name || "")
.toLowerCase();

return (
name.includes(search) &&
(
status==="Tous" ||
game.status===status
)
);

});


games.sort((a,b)=>{

if(sort==="name")
return a.name.localeCompare(b.name);

if(sort==="rating")
return (b.note||0)-(a.note||0);

if(sort==="progress")
return (b.progress||0)-(a.progress||0);

if(sort==="time"){

const aTime =
(a.hours||0)*60+
(a.minutes||0);

const bTime =
(b.hours||0)*60+
(b.minutes||0);

return bTime-aTime;

}

return (b.addedAt||0)-
(a.addedAt||0);

});


document.getElementById(
"libraryCount"
).textContent =
`${games.length} jeu(x) affiché(s) sur ${library.length}`;


if(!games.length){

container.innerHTML =
`
<div class="empty">
Ta bibliothèque est vide.
</div>
`;

return;

}


container.innerHTML = "";

games.forEach(game=>{

const item =
document.createElement("div");

item.className =
"library-item";

const image =
game.background_image || "";

const totalMinutes =
(game.hours||0)*60+
(game.minutes||0);

const time =
totalMinutes
?
`${game.hours||0} h ${game.minutes||0} min`
:
"Aucun temps";


item.innerHTML = `

<img
src="${image}"
alt=""
>

<div class="library-info">

<div class="library-name">
${escapeHtml(game.name)}
</div>

<div class="small">
${game.released || ""}
</div>

<div class="line">
⭐ ${
game.note
?
game.note+" / 10"
:
"Pas noté"
}
</div>

<div class="line">
📊 ${game.progress||0}%
</div>

<div class="line">
🕐 ${time}
</div>

<div class="badge">
${escapeHtml(game.status || "À jouer")}
</div>

</div>
`;

item.onclick =
()=>openGame(game);

container.appendChild(item);

});

}


/* =========================
   STATISTIQUES
========================= */

function renderStats(){

const container =
document.getElementById(
"statsContent"
);

const total =
library.length;

const completed =
library.filter(
g=>g.status==="Terminé"
).length;

const playing =
library.filter(
g=>g.status==="En cours"
).length;

const waiting =
library.filter(
g=>g.status==="À jouer"
).length;

const rated =
library.filter(
g=>Number(g.note)>0
);

const average =
rated.length
?
(
rated.reduce(
(sum,g)=>sum+Number(g.note),
0
)/rated.length
).toFixed(1)
:
"—";

const totalMinutes =
library.reduce(
(sum,g)=>
sum+
Number(g.hours||0)*60+
Number(g.minutes||0),
0
);

const totalHours =
Math.floor(totalMinutes/60);

const progress =
total
?
Math.round(
library.reduce(
(sum,g)=>
sum+Number(g.progress||0),
0
)/total
)
:
0;

const completion =
total
?
Math.round(
completed/total*100
)
:
0;

const best =
rated.length
?
[...rated].sort(
(a,b)=>
(b.note||0)-(a.note||0)
)[0]
:
null;

const mostPlayed =
library.length
?
[...library].sort(
(a,b)=>
(
(b.hours||0)*60+
(b.minutes||0)
)-
(
(a.hours||0)*60+
(a.minutes||0)
)
)[0]
:
null;


container.innerHTML = `

<div class="stats">

<div class="stat">
<div class="stat-icon">🎮</div>
<div class="stat-number">${total}</div>
<div class="stat-label">Jeux</div>
</div>

<div class="stat">
<div class="stat-icon">🏆</div>
<div class="stat-number">${completed}</div>
<div class="stat-label">Terminés</div>
</div>

<div class="stat">
<div class="stat-icon">⭐</div>
<div class="stat-number">${average}</div>
<div class="stat-label">Note moyenne</div>
</div>

<div class="stat">
<div class="stat-icon">🕐</div>
<div class="stat-number">${totalHours}h</div>
<div class="stat-label">Temps total</div>
</div>

</div>


<div class="stats-box">

<h3>📊 Progression moyenne</h3>

<div class="big">
${progress}%
</div>

<div class="bar">
<div
class="fill"
style="width:${progress}%"
></div>
</div>

<p>
${completion}% de ta bibliothèque est terminée.
</p>

</div>


<div class="stats-box">

<h3>🎯 Répartition</h3>

<p>📌 À jouer : <strong>${waiting}</strong></p>

<p>🎮 En cours : <strong>${playing}</strong></p>

<p>🏆 Terminés : <strong>${completed}</strong></p>

</div>


${
best
?
`
<div class="stats-box">

<h3>⭐ Jeu le mieux noté</h3>

<div class="best">

<img
src="${best.background_image || ""}"
alt=""
>

<div>

<strong>
${escapeHtml(best.name)}
</strong>

<div class="big">
${best.note}/10
</div>

</div>

</div>

</div>
`
:
""
}


${
mostPlayed &&
(
mostPlayed.hours ||
mostPlayed.minutes
)
?
`
<div class="stats-box">

<h3>🕐 Jeu le plus joué</h3>

<div class="best">

<img
src="${mostPlayed.background_image || ""}"
alt=""
>

<div>

<strong>
${escapeHtml(mostPlayed.name)}
</strong>

<div class="big">
${mostPlayed.hours||0}h
${mostPlayed.minutes||0}min
</div>

</div>

</div>

</div>
`
:
""
}

`;

}

function hideAll(){

[
"searchSection",
"detailSection",
"librarySection",
"statsSection"
]
.forEach(id=>
document
.getElementById(id)
.classList.add("hidden")
);

[
"navSearch",
"navLibrary",
"navStats"
]
.forEach(id=>
document
.getElementById(id)
.classList.remove("active")
);

}


function showSearch(){

hideAll();

document
.getElementById("searchSection")
.classList.remove("hidden");

document
.getElementById("navSearch")
.classList.add("active");

}


function showLibrary(){

hideAll();

document
.getElementById("librarySection")
.classList.remove("hidden");

document
.getElementById("navLibrary")
.classList.add("active");

renderLibrary();

}


function showStats(){

hideAll();

document
.getElementById("statsSection")
.classList.remove("hidden");

document
.getElementById("navStats")
.classList.add("active");

renderStats();

}

   UTILITAIRES
========================= */

function cleanDescription(value){

if(!value)
return "";

const div =
document.createElement("div");

div.innerHTML =
value;

return (
div.textContent ||
div.innerText ||
""
).trim();

}


function escapeHtml(value){

const div =
document.createElement("div");

div.textContent =
value == null
?
""
:
String(value);

return div.innerHTML;

}

}
);
