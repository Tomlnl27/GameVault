<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#09090d;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

header{
padding:22px 18px 18px;
background:#101016;
border-bottom:1px solid #24242d
}

.logo{
font-size:29px;
font-weight:900;
letter-spacing:-1px
}

.subtitle{
color:#858590;
font-size:14px;
margin-top:4px
}

nav{
display:flex;
gap:8px;
padding:12px 16px;
background:#101016;
border-bottom:1px solid #20202a;
overflow-x:auto
}

nav button{
border:1px solid #2b2b35;
background:#191920;
color:#ddd;
padding:10px 14px;
border-radius:10px;
white-space:nowrap;
font-weight:700;
cursor:pointer
}

nav button.active{
background:#fff;
color:#000
}

main{
max-width:1100px;
margin:auto;
padding:20px
}

.hidden{display:none!important}

.search{
display:flex;
gap:10px;
margin-bottom:18px
}

.search input{
flex:1;
min-width:0;
background:#15151c;
color:#fff;
border:1px solid #30303a;
border-radius:12px;
padding:14px;
font-size:16px;
outline:none
}

.search button{
border:0;
background:#fff;
color:#000;
border-radius:12px;
padding:0 18px;
font-weight:800;
cursor:pointer
}

.status{
color:#858590;
font-size:14px;
margin-bottom:18px
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:16px
}

.card{
background:#14141b;
border:1px solid #25252f;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.15s
}

.card:hover{
transform:translateY(-3px)
}

.card img{
display:block;
width:100%;
height:225px;
object-fit:cover
}

.card-content{
padding:12px
}

.card-title{
font-weight:800;
line-height:1.25
}

.card-date{
font-size:12px;
color:#777783;
margin-top:6px
}

.empty{
text-align:center;
color:#777783;
padding:50px 15px
}

/* DETAIL */

.back{
border:0;
background:#20202a;
color:#fff;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:700
}

.detail{
margin-top:18px;
background:#14141b;
border:1px solid #292933;
border-radius:18px;
overflow:hidden
}

.detail-top{
display:grid;
grid-template-columns:300px 1fr;
gap:25px;
padding:20px
}

.cover{
width:100%;
max-height:460px;
object-fit:cover;
border-radius:13px
}

.detail-title{
font-size:35px;
line-height:1.05;
margin:5px 0 8px
}

.release{
color:#858590;
font-size:14px;
margin-bottom:18px
}

.description{
color:#c9c9d0;
line-height:1.65;
font-size:15px
}

.meta{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px
}

.meta-box{
background:#0d0d12;
border:1px solid #292933;
border-radius:11px;
padding:12px
}

.meta-label{
font-size:11px;
color:#777783;
margin-bottom:5px
}

.meta-value{
font-size:14px;
font-weight:700
}

.panel{
margin:0 20px 15px;
padding:16px;
background:#0d0d12;
border:1px solid #292933;
border-radius:13px
}

.panel-title{
font-weight:800;
margin-bottom:12px
}

.rating{
font-size:30px;
font-weight:900;
margin-bottom:12px
}

.rating-controls{
display:flex;
align-items:center;
gap:12px
}

.rating-controls button{
width:43px;
height:43px;
border-radius:10px;
border:1px solid #34343f;
background:#20202a;
color:#fff;
font-size:23px;
cursor:pointer
}

.rating-controls button:disabled{
opacity:.3
}

select{
background:#1b1b23;
color:#fff;
border:1px solid #353540;
border-radius:9px;
padding:10px;
outline:none
}

.slider{
width:100%;
margin-top:8px
}

.progress-number{
font-size:24px;
font-weight:900
}

.time-inputs{
display:flex;
gap:8px;
flex-wrap:wrap
}

.time-inputs input{
width:100px;
padding:10px;
background:#1b1b23;
color:#fff;
border:1px solid #353540;
border-radius:9px
}

.action{
margin:0 20px 20px;
display:flex;
gap:10px;
flex-wrap:wrap
}

.action button{
padding:12px 15px;
border-radius:10px;
border:0;
font-weight:800;
cursor:pointer
}

.add{
background:#fff;
color:#000
}

.delete{
background:#2a171a;
color:#ff929b
}

/* CORBEILLES */
.wishlist-delete,
.library-delete{
margin-left:auto;
flex:none;
padding:6px 8px;
border:0;
background:transparent;
color:#fff;
font-size:20px;
line-height:1;
cursor:pointer;
border-radius:8px
}
.wishlist-delete:hover,
.library-delete:hover{
background:#20202a
}

.in-library{
background:#20202a!important;
color:#fff!important;
cursor:default!important
}

/* LIBRARY */

.library-tools{
display:grid;
grid-template-columns:1fr 180px 180px;
gap:10px;
margin-bottom:15px
}

.library-tools input,
.library-tools select{
width:100%;
padding:11px;
background:#15151c;
color:#fff;
border:1px solid #30303a;
border-radius:10px
}

.count{
color:#858590;
font-size:14px;
margin-bottom:15px
}

.library-item{
display:flex;
gap:14px;
align-items:center;
padding:12px;
margin-bottom:10px;
background:#14141b;
border:1px solid #25252f;
border-radius:13px;
cursor:pointer
}

.library-item:hover{
border-color:#444451
}

.library-item img{
width:65px;
height:85px;
object-fit:cover;
border-radius:8px
}

.library-info{
flex:1;
min-width:0
}

.library-name{
font-weight:850
}

.library-small{
color:#777783;
font-size:12px;
margin-top:4px
}

.library-line{
font-size:13px;
margin-top:5px
}

.badge{
display:inline-block;
margin-top:7px;
padding:5px 8px;
background:#20202a;
border-radius:7px;
font-size:11px;
color:#bbb
}

/* STATS */

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.stat{
background:#14141b;
border:1px solid #292933;
border-radius:14px;
padding:17px
}

.stat-icon{
font-size:24px
}

.stat-number{
font-size:28px;
font-weight:900;
margin-top:7px
}

.stat-label{
font-size:12px;
color:#858590;
margin-top:4px
}

.stats-box{
margin-top:15px;
background:#14141b;
border:1px solid #292933;
border-radius:14px;
padding:18px
}

.big{
font-size:32px;
font-weight:900
}

.bar{
height:13px;
background:#292933;
border-radius:20px;
overflow:hidden;
margin-top:12px
}

.fill{
height:100%;
background:#fff
}

.best{
display:flex;
align-items:center;
gap:14px
}

.best img{
width:60px;
height:80px;
object-fit:cover;
border-radius:8px
}


/* WISHLIST / UPCOMING */
.wishlist-tools{
display:grid;
grid-template-columns:1fr 180px;
gap:10px;
margin-bottom:15px
}
.wishlist-tools input,
.wishlist-tools select{
width:100%;
background:#15151c;
color:#fff;
border:1px solid #292933;
padding:11px;
border-radius:10px
}
.wishlist-item{
display:flex;
gap:14px;
align-items:center;
background:#14141b;
border:1px solid #292933;
padding:12px;
border-radius:13px;
margin-bottom:10px;
cursor:pointer
}
.wishlist-item img{
width:65px;
height:85px;
object-fit:cover;
border-radius:8px
}
.wishlist-info{
flex:1;
min-width:0
}
.wishlist-name{
font-weight:850
}
.wishlist-date{
color:#858590;
font-size:12px;
margin-top:5px
}
.wishlist-count{
color:#858590;
font-size:13px;
margin-bottom:12px
}
.wishlist-badge{
display:inline-block;
margin-top:7px;
padding:5px 8px;
border-radius:7px;
background:#20202a;
font-size:11px;
color:#bbb
}
.upcoming-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:15px
}
.upcoming-card{
background:#14141b;
border:1px solid #292933;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.15s
}
.upcoming-card:hover{
transform:translateY(-3px);
border-color:#555563
}
.upcoming-card img{
display:block;
width:100%;
height:235px;
object-fit:cover
}
.upcoming-body{
padding:11px
}
.upcoming-name{
font-weight:850;
line-height:1.3
}
.upcoming-date{
color:#858590;
font-size:12px;
margin-top:6px
}
.countdown{
margin-top:8px;
display:inline-block;
padding:5px 8px;
border-radius:7px;
background:#242630;
font-size:11px;
font-weight:800
}
.upcoming-loading{
padding:40px;
text-align:center;
color:#858590
}
@media(max-width:600px){
.wishlist-tools{
grid-template-columns:1fr
}
.upcoming-grid{
grid-template-columns:repeat(2,1fr);
gap:12px
}
.upcoming-card img{
height:220px
}
}

/* SERIES / FRANCHISE */

.series-panel{
margin:0 20px 15px;
padding:16px;
background:#0d0d12;
border:1px solid #292933;
border-radius:13px
}

.series-title{
font-size:18px;
font-weight:900;
margin-bottom:13px
}

.series-list{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:6px;
scrollbar-width:thin
}

.series-card{
flex:0 0 135px;
background:#15151c;
border:1px solid #292933;
border-radius:11px;
overflow:hidden;
cursor:pointer;
transition:.15s
}

.series-card:hover{
transform:translateY(-3px);
border-color:#555563
}

.series-card img{
display:block;
width:100%;
height:185px;
object-fit:cover
}

.series-card-body{
padding:9px
}

.series-card-name{
font-size:13px;
font-weight:800;
line-height:1.25
}

.series-card-date{
font-size:11px;
color:#777783;
margin-top:5px
}

.series-empty{
color:#777783;
font-size:13px
}

@media(max-width:800px){

.detail-top{
grid-template-columns:1fr
}

.cover{
max-width:280px
}

.stats-grid{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:600px){

.series-card{
flex-basis:125px
}

.series-card img{
height:170px
}

main{
padding:15px
}

.search{
flex-direction:column
}

.search button{
height:48px
}

.games{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.card img{
height:230px
}

.detail-title{
font-size:28px
}

.meta{
grid-template-columns:1fr
}

.library-tools{
grid-template-columns:1fr
}

.stats-grid{
grid-template-columns:repeat(2,1fr)
}

}
</style>
</head>

<body>

<header>
<div class="logo">🎮 GameVault</div>
<div class="subtitle">Ta bibliothèque gaming</div>
</header>

<nav>
<button id="tabSearch" class="active" onclick="showSearch()">🔎 Recherche</button>
<button id="tabLibrary" onclick="showLibrary()">📚 Ma bibliothèque</button>
<button id="tabWishlist" onclick="showWishlist()">❤️ Souhaits</button>
<button id="tabUpcoming" onclick="showUpcoming()">📅 Prochaines sorties</button>
<button id="tabStats" onclick="showStats()">📊 Statistiques</button>
</nav>

<main>

<section id="searchSection">

<div class="search">
<input id="searchInput" placeholder="Rechercher un jeu...">
<button onclick="searchGames()">Rechercher</button>
</div>

<div id="status" class="status">
Recherche ton prochain jeu 🎮
</div>

<div id="games" class="games"></div>

</section>


<section id="detailSection" class="hidden">

<button class="back" onclick="showSearch()">← Retour</button>

<div id="detail"></div>

</section>


<section id="librarySection" class="hidden">

<h2>📚 Ma bibliothèque</h2>

<div class="library-tools">

<input
id="librarySearch"
placeholder="🔎 Rechercher..."
oninput="renderLibrary()"
>

<select id="statusFilter" onchange="renderLibrary()">
<option value="Tous">Tous les statuts</option>
<option value="À jouer">À jouer</option>
<option value="En cours">En cours</option>
<option value="Terminé">Terminé</option>
</select>

<select id="sortFilter" onchange="renderLibrary()">
<option value="recent">Plus récent</option>
<option value="name">Nom A → Z</option>
<option value="rating">Meilleure note</option>
<option value="progress">Progression</option>
<option value="time">Temps de jeu</option>
</select>

</div>

<div id="libraryCount" class="count"></div>
<div id="library"></div>

</section>



<section id="wishlistSection" class="hidden">

<h2>❤️ Ma liste de souhaits</h2>

<div class="wishlist-tools">

<input
id="wishlistSearch"
placeholder="🔎 Rechercher dans mes souhaits..."
oninput="renderWishlist()"
>

<select id="wishlistSort" onchange="renderWishlist()">
<option value="date">Date de sortie</option>
<option value="name">Nom A → Z</option>
</select>

</div>

<div id="wishlistCount" class="wishlist-count"></div>
<div id="wishlist"></div>

</section>


<section id="upcomingSection" class="hidden">

<h2>📅 Prochaines sorties</h2>

<div id="upcomingStatus" class="status">
Chargement des prochains jeux...
</div>

<div id="upcoming" class="upcoming-grid"></div>

</section>


<section id="statsSection" class="hidden">

<h2>📊 Mes statistiques</h2>

<div id="statsContent"></div>

</section>

</main>


<script>

const WORKER_URL =
"https://gamevault-api.tom-lunel27200.workers.dev";

let currentGame = null;

let library =
JSON.parse(
localStorage.getItem("gamevault_library")
) || [];

let wishlist =
JSON.parse(
localStorage.getItem("gamevault_wishlist")
) || [];


/* =========================
   RECHERCHE
========================= */

async function searchGames(){

const input =
document.getElementById("searchInput");

const games =
document.getElementById("games");

const status =
document.getElementById("status");

const query =
input.value.trim();

if(query.length < 2){

status.textContent =
"Écris au moins 2 caractères.";

return;
}

status.textContent =
"Recherche en cours...";

games.innerHTML =
'<div class="empty">🔎 Recherche...</div>';

try{

const response =
await fetch(
WORKER_URL +
"/search?q=" +
encodeURIComponent(query)
);

const data =
await response.json();

if(!response.ok ||
!data.results){

throw new Error("Erreur RAWG");
}

if(data.results.length === 0){

games.innerHTML =
'<div class="empty">Aucun jeu trouvé.</div>';

status.textContent =
"Aucun résultat.";

return;
}

status.textContent =
data.results.length +
" jeu(x) trouvé(s).";

games.innerHTML = "";

data.results.forEach(game => {

const card =
document.createElement("div");

card.className =
"card";

const image =
game.background_image ||
"https://via.placeholder.com/400x600?text=Game";

card.innerHTML = `
<img src="${image}" alt="">
<div class="card-content">
<div class="card-title">
${escapeHtml(game.name || "Jeu")}
</div>
<div class="card-date">
${game.released || "Date inconnue"}
</div>
</div>
`;

card.onclick =
() => openGame(game);

games.appendChild(card);

});

}catch(error){

console.error(error);

status.textContent =
"Erreur lors de la recherche.";

games.innerHTML =
'<div class="empty">Impossible de contacter GameVault.</div>';

}

}


/* =========================
   FICHE DÉTAILLÉE
========================= */

async function openGame(game){

currentGame = game;

hideSections();

document
.getElementById("detailSection")
.classList.remove("hidden");

await renderDetail();

}


async function renderDetail(){

if(!currentGame) return;

const detail =
document.getElementById("detail");

detail.innerHTML =
'<div class="empty">Chargement de la fiche...</div>';

let game =
currentGame;

let seriesGames = [];


/*
   TON WORKER UTILISE :
   /game/ID
*/

try{

const response =
await fetch(
WORKER_URL +
"/game/" +
encodeURIComponent(game.id)
);

if(response.ok){

const data =
await response.json();

game = {
...game,
...data
};

currentGame = game;

}

}catch(error){

console.log(error);

}


/* =========================
   SÉRIE / FRANCHISE
========================= */

try{

const seriesResponse =
await fetch(
WORKER_URL +
"/game-series/" +
encodeURIComponent(game.id)
);

if(seriesResponse.ok){

const seriesData =
await seriesResponse.json();

if(Array.isArray(seriesData.results)){

seriesGames =
seriesData.results
.filter(item => item.id !== game.id)
.sort((a,b)=>{

const dateA = a.released || "9999-12-31";
const dateB = b.released || "9999-12-31";

return dateA.localeCompare(dateB);

});

}

}

}catch(error){

console.log("Série indisponible",error);

}


/* Jeu déjà sauvegardé ? */

const saved =
library.find(
item => item.id === game.id
);

const wished =
wishlist.find(
item => item.id === game.id
);


/* Informations */

const image =
game.background_image ||
"https://via.placeholder.com/400x600?text=Game";

const description =
game.description_raw ||
stripHtml(game.description) ||
"Aucune description disponible.";

const developers =
game.developers &&
game.developers.length
?
game.developers
.map(x => x.name)
.join(", ")
:
"Inconnu";

const publishers =
game.publishers &&
game.publishers.length
?
game.publishers
.map(x => x.name)
.join(", ")
:
"Inconnu";

const genres =
game.genres &&
game.genres.length
?
game.genres
.map(x => x.name)
.join(", ")
:
"Inconnu";

const platforms =
game.platforms &&
game.platforms.length
?
game.platforms
.map(x =>
x.platform
?
x.platform.name
:
x.name
)
.join(", ")
:
"Inconnues";

const rating =
saved
?
Number(saved.note || 0)
:
0;

const progress =
saved
?
Number(saved.progress || 0)
:
0;

const hours =
saved
?
Number(saved.hours || 0)
:
0;

const minutes =
saved
?
Number(saved.minutes || 0)
:
0;

const status =
saved
?
saved.status
:
"À jouer";


detail.innerHTML = `

<div class="detail">

<div class="detail-top">

<img
class="cover"
src="${image}"
alt=""
>

<div>

<h1 class="detail-title">
${escapeHtml(game.name || "Jeu")}
</h1>

<div class="release">
📅 ${game.released || "Date inconnue"}
</div>

<div class="description">
${escapeHtml(description)}
</div>

<div class="meta">

<div class="meta-box">
<div class="meta-label">🛠️ DÉVELOPPEUR</div>
<div class="meta-value">
${escapeHtml(developers)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">🏢 ÉDITEUR</div>
<div class="meta-value">
${escapeHtml(publishers)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">🎭 GENRES</div>
<div class="meta-value">
${escapeHtml(genres)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">🎮 PLATEFORMES</div>
<div class="meta-value">
${escapeHtml(platforms)}
</div>
</div>

<div class="meta-box">
<div class="meta-label">⭐ NOTE RAWG</div>
<div class="meta-value">
${game.rating ? game.rating + " / 5" : "N/A"}
</div>
</div>

<div class="meta-box">
<div class="meta-label">👥 AVIS</div>
<div class="meta-value">
${game.ratings_count || "N/A"}
</div>
</div>

</div>

</div>

</div>


${
seriesGames.length
? `
<div class="series-panel">

<div class="series-title">
🎮 Série / Franchise
</div>

<div class="series-list">

${seriesGames.map(item => `

<div
class="series-card"
onclick="openSeriesGame(${item.id})">

<img
src="${escapeHtml(item.background_image || "https://via.placeholder.com/300x450?text=Game")}"
alt=""
>

<div class="series-card-body">

<div class="series-card-name">
${escapeHtml(item.name || "Jeu")}
</div>

<div class="series-card-date">
${item.released || "Date inconnue"}
</div>

</div>

</div>

`).join("")}

</div>

</div>
`
: ""
}


<div class="panel">

<div class="panel-title">
⭐ Ma note
</div>

<div class="rating">
<span id="ratingValue">
${rating}
</span>
 / 10
</div>

<div class="rating-controls">

<button
id="minusRating"
onclick="changeRating(-0.5)">
−
</button>

<span>par 0,5</span>

<button
id="plusRating"
onclick="changeRating(0.5)">
+
</button>

</div>

</div>


<div class="panel">

<div class="panel-title">
📊 Ma progression
</div>

<div class="progress-number">

Terminé
</option>

saved
?
`

:

/* =========================
   OUVRIR UN JEU DE LA SÉRIE
========================= */

async function openSeriesGame(gameId){

try{

const response =
await fetch(
WORKER_URL +
"/game/" +
encodeURIComponent(gameId)
);

if(!response.ok){
throw new Error("Impossible de charger le jeu");
}

const game =
await response.json();

currentGame = game;

await renderDetail();

}catch(error){

console.error(error);

}

}


/* =========================
   BIBLIOTHÈQUE
========================= */

function getCurrentSaved(){

if(!currentGame) return null;

return library.find(
item => item.id === currentGame.id
);

}


function ensureSaved(){

let game =
getCurrentSaved();

if(game) return game;

game = {

id:currentGame.id,

name:currentGame.name,

background_image:
currentGame.background_image,

released:
currentGame.released,

note:0,

progress:0,

hours:0,

minutes:0,

status:"À jouer",

addedAt:Date.now()

};

library.push(game);

saveLibrary();

return game;

}


function addCurrentGame(){

ensureSaved();

renderDetail();

}


function changeRating(amount){

const game =
ensureSaved();

let rating =
Number(game.note || 0) +
amount;

rating =
Math.round(rating * 2) / 2;

rating =
Math.max(
0,
Math.min(
10,
rating
)
);

game.note =
rating;

saveLibrary();

document.getElementById(
"ratingValue"
).textContent =
rating;

updateRatingButtons();

}


function updateRatingButtons(){

const game =
getCurrentSaved();

if(!game) return;

const minus =
document.getElementById(
"minusRating"
);

const plus =
document.getElementById(
"plusRating"
);

if(minus)
minus.disabled =
game.note <= 0;

if(plus)
plus.disabled =
game.note >= 10;

}


function changeProgress(value){

const game =
ensureSaved();

game.progress =
Number(value);

const display =
document.getElementById(
"progressValue"
);

if(display)
display.textContent =
value;

saveLibrary();

}


function saveTime(){

const game =
ensureSaved();

let hours =
parseInt(
document.getElementById(
"hoursInput"
).value
) || 0;

let minutes =
parseInt(
document.getElementById(
"minutesInput"
).value
) || 0;

hours +=
Math.floor(minutes / 60);

minutes =
minutes % 60;

game.hours =
Math.max(0,hours);

game.minutes =
Math.max(0,minutes);

saveLibrary();

renderDetail();

}


function changeStatus(value){

const game =
ensureSaved();

game.status =
value;

saveLibrary();

renderDetail();

}


function deleteCurrentGame(){

if(!currentGame) return;

const gameId = Number(currentGame.id);

if(!confirm("Supprimer ce jeu de ta bibliothèque ?")) return;

library = library.filter(
item => Number(item.id) !== gameId
);

saveLibrary();

showLibrary();

}

function deleteLibraryGame(gameId){

const id = Number(gameId);

const game = library.find(
item => Number(item.id) === id
);

if(!game) return;

if(!confirm(`Supprimer "${game.name}" de ta bibliothèque ?`)) return;

library = library.filter(
item => Number(item.id) !== id
);

saveLibrary();
renderLibrary();

}



function saveWishlist(){

localStorage.setItem(
"gamevault_wishlist",
JSON.stringify(wishlist)
);

}


function toggleWishlist(){

if(!currentGame) return;

const index =
wishlist.findIndex(
item => item.id === currentGame.id
);

if(index >= 0){

wishlist.splice(index,1);

}else{

wishlist.push({
id:currentGame.id,
name:currentGame.name,
background_image:currentGame.background_image,
released:currentGame.released || null,
tba:!!currentGame.tba,
addedAt:Date.now()
});

}

saveWishlist();
renderDetail();

}


function removeFromWishlist(gameId){

wishlist =
wishlist.filter(
item => item.id !== gameId
);

saveWishlist();
renderWishlist();

}


function daysUntil(dateString){

if(!dateString) return null;

const today =
new Date();

today.setHours(0,0,0,0);

const date =
new Date(dateString + "T00:00:00");

if(Number.isNaN(date.getTime()))
return null;

return Math.ceil(
(date - today) / 86400000
);

}


function releaseLabel(game){

if(game.tba || !game.released)
return "📅 Date à confirmer";

const days =
daysUntil(game.released);

if(days === null)
return "📅 Date inconnue";

if(days < 0)
return "🟢 Sorti";

if(days === 0)
return "🔥 Sortie aujourd'hui";

if(days === 1)
return "⏳ Sortie demain";

return `⏳ Sortie dans ${days} jours`;

}


function renderWishlist(){

const container =
document.getElementById("wishlist");

if(!container) return;

const search =
(
document.getElementById("wishlistSearch").value || ""
)
.toLowerCase()
.trim();

const sort =
document.getElementById("wishlistSort").value;

let items =
wishlist.filter(item =>
(item.name || "").toLowerCase().includes(search)
);

items.sort((a,b)=>{

if(sort === "name")
return (a.name || "").localeCompare(b.name || "");

const da =
a.released || "9999-12-31";

const db =
b.released || "9999-12-31";

return da.localeCompare(db);

});

document.getElementById("wishlistCount").textContent =
`${items.length} jeu(x) dans tes souhaits`;

if(!items.length){

container.innerHTML =
'<div class="empty">❤️ Aucun jeu dans ta liste de souhaits.</div>';

return;

}

container.innerHTML = "";

items.forEach(game=>{

const item =
document.createElement("div");

item.className =
"wishlist-item";

const image =
game.background_image ||
"https://via.placeholder.com/100x150?text=Game";

item.innerHTML = `

<img src="${image}" alt="">

<div class="wishlist-info">

<div class="wishlist-name">
${escapeHtml(game.name || "Jeu")}
</div>

<div class="wishlist-date">
${game.released || "Date à confirmer"}
</div>

<div class="wishlist-badge">
${releaseLabel(game)}
</div>

</div>

<button
class="wishlist-delete"
title="Retirer des souhaits"
onclick="event.stopPropagation();removeFromWishlist(${Number(game.id)})">
🗑️
</button>

`;

item.onclick =
()=>openGame(game);

container.appendChild(item);

});

}


async function loadUpcoming(){

const container =
document.getElementById("upcoming");

const status =
document.getElementById("upcomingStatus");

if(!container || !status) return;

container.innerHTML =
'<div class="upcoming-loading">📅 Chargement...</div>';

status.textContent =
"Recherche des prochaines sorties...";

const today =
new Date();

const from =
today.toISOString().slice(0,10);

const future =
new Date(today);

future.setDate(
future.getDate() + 365
);

const to =
future.toISOString().slice(0,10);

try{

const response =
await fetch(
WORKER_URL +
"/upcoming?from=" +
encodeURIComponent(from) +
"&to=" +
encodeURIComponent(to)
);

const data =
await response.json();

if(!response.ok || !Array.isArray(data.results)){

throw new Error(
data.error || "Impossible de charger les sorties"
);

}

const games =
data.results
.filter(game => game.released)
.sort((a,b)=>
a.released.localeCompare(b.released)
);

status.textContent =
`${games.length} prochaine(s) sortie(s) trouvée(s).`;

if(!games.length){

container.innerHTML =
'<div class="empty">Aucune sortie trouvée.</div>';

return;

}

container.innerHTML = "";

games.forEach(game=>{

const card =
document.createElement("div");

card.className =
"upcoming-card";

const image =
game.background_image ||
"https://via.placeholder.com/400x600?text=Game";

card.innerHTML = `

<img src="${image}" alt="">

<div class="upcoming-body">

<div class="upcoming-name">
${escapeHtml(game.name || "Jeu")}
</div>

<div class="upcoming-date">
📅 ${game.released}
</div>

<div class="countdown">
${releaseLabel(game)}
</div>

</div>
`;

card.onclick =
()=>openGame(game);

container.appendChild(card);

});

}catch(error){

console.error(error);

status.textContent =
"Erreur lors du chargement des sorties.";

container.innerHTML =
`
<div class="empty">
❌ ${escapeHtml(error.message)}
</div>
`;

}

}


function saveLibrary(){

localStorage.setItem(
"gamevault_library",
JSON.stringify(library)
);

}


/* =========================
   BIBLIOTHÈQUE
========================= */

function renderLibrary(){

const container =
document.getElementById(
"library"
);

const search =
(
document.getElementById(
"librarySearch"
).value || ""
)
.toLowerCase()
.trim();

const statusFilter =
document.getElementById(
"statusFilter"
).value;

const sort =
document.getElementById(
"sortFilter"
).value;

let games =
library.filter(game => {

const nameMatch =
game.name
.toLowerCase()
.includes(search);

const statusMatch =
statusFilter === "Tous" ||
game.status === statusFilter;

return nameMatch &&
statusMatch;

});


games.sort((a,b)=>{

if(sort === "name")
return a.name.localeCompare(b.name);

if(sort === "rating")
return (b.note||0)-(a.note||0);

if(sort === "progress")
return (b.progress||0)-(a.progress||0);

if(sort === "time"){

const aTime =
(a.hours||0)*60+(a.minutes||0);

const bTime =
(b.hours||0)*60+(b.minutes||0);

return bTime-aTime;

}

return (b.addedAt||0) -
(a.addedAt||0);

});


document.getElementById(
"libraryCount"
).textContent =
`${games.length} jeu(x) affiché(s) sur ${library.length}`;


if(!games.length){

container.innerHTML =
'<div class="empty">Ta bibliothèque est vide ou aucun jeu ne correspond.</div>';

return;

}


container.innerHTML = "";

games.forEach(game=>{

const item =
document.createElement("div");

item.className =
"library-item";

const image =
game.background_image ||
"https://via.placeholder.com/100x150?text=Game";

const time =
(game.hours||0) ||
(game.minutes||0)
?
`${game.hours||0} h ${game.minutes||0} min`
:
"Aucun temps";


item.innerHTML = `

<img src="${image}" alt="">

<div class="library-info">

<div class="library-name">
${escapeHtml(game.name)}
</div>

<div class="library-small">
${game.released || ""}
</div>

<div class="library-line">
⭐ ${game.note > 0 ? game.note + " / 10" : "Pas noté"}
</div>

<div class="library-line">
📊 ${game.progress || 0}%
</div>

<div class="library-line">
🕐 ${time}
</div>

<div class="badge">
${escapeHtml(game.status || "À jouer")}
</div>

</div>

<button
class="library-delete"
title="Supprimer de la bibliothèque"
onclick="event.stopPropagation();deleteLibraryGame(${Number(game.id)})">
🗑️
</button>

`;

item.onclick =
()=>openGame(game);

container.appendChild(item);

});

}


/* =========================
   STATISTIQUES
========================= */

function renderStats(){

const container =
document.getElementById(
"statsContent"
);

const total =
library.length;

const completed =
library.filter(
g=>g.status==="Terminé"
).length;

const playing =
library.filter(
g=>g.status==="En cours"
).length;

const toPlay =
library.filter(
g=>g.status==="À jouer"
).length;

const rated =
library.filter(
g=>Number(g.note)>0
);

const average =
rated.length
?
(
rated.reduce(
(sum,g)=>sum+Number(g.note),
0
) /
rated.length
).toFixed(1)
:
"—";

const totalMinutes =
library.reduce(
(sum,g)=>
sum+
Number(g.hours||0)*60+
Number(g.minutes||0),
0
);

const totalHours =
Math.floor(
totalMinutes / 60
);

const averageProgress =
total
?
Math.round(
library.reduce(
(sum,g)=>
sum+Number(g.progress||0),
0
) /
total
)
:
0;

const completion =
total
?
Math.round(
completed/total*100
)
:
0;

const best =
rated.length
?
[...rated].sort(
(a,b)=>
(b.note||0)-
(a.note||0)
)[0]
:
null;

const mostPlayed =
library.length
?
[...library].sort(
(a,b)=>{

const aTime =
(a.hours||0)*60+
(a.minutes||0);

const bTime =
(b.hours||0)*60+
(b.minutes||0);

return bTime-aTime;

}
)[0]
:
null;


container.innerHTML = `

<div class="stats-grid">

<div class="stat">
<div class="stat-icon">🎮</div>
<div class="stat-number">${total}</div>
<div class="stat-label">Jeux</div>
</div>

<div class="stat">
<div class="stat-icon">🏆</div>
<div class="stat-number">${completed}</div>
<div class="stat-label">Terminés</div>
</div>

<div class="stat">
<div class="stat-icon">⭐</div>
<div class="stat-number">${average}</div>
<div class="stat-label">Note moyenne</div>
</div>

<div class="stat">
<div class="stat-icon">🕐</div>
<div class="stat-number">${totalHours}h</div>
<div class="stat-label">Temps total</div>
</div>

</div>


<div class="stats-box">

<h3>📊 Progression moyenne</h3>

<div class="big">
${averageProgress}%
</div>

<div class="bar">
<div
class="fill"
style="width:${averageProgress}%">
</div>
</div>

<p>
${completion}% de ta bibliothèque est terminée.
</p>

</div>


<div class="stats-box">

<h3>🎯 Répartition</h3>

<p>📌 À jouer : <strong>${toPlay}</strong></p>

<p>🎮 En cours : <strong>${playing}</strong></p>

<p>🏆 Terminés : <strong>${completed}</strong></p>

</div>


${
best
?
`

<div class="stats-box">

<h3>⭐ Jeu le mieux noté</h3>

<div class="best">

<img
src="${best.background_image || ""}"
alt=""
>

<div>

<strong>
${escapeHtml(best.name)}
</strong>

<div class="big">
${best.note}/10
</div>

</div>

</div>

</div>

`
:
""
}


${
mostPlayed &&
(
mostPlayed.hours > 0 ||
mostPlayed.minutes > 0
)
?
`

<div class="stats-box">

<h3>🕐 Jeu le plus joué</h3>

<div class="best">

<img
src="${mostPlayed.background_image || ""}"
alt=""
>

<div>

<strong>
${escapeHtml(mostPlayed.name)}
</strong>

<div class="big">
${mostPlayed.hours||0}h
${mostPlayed.minutes||0}min
</div>

</div>

</div>

</div>

`
:
""
}

`;

}


/* =========================
   NAVIGATION
========================= */

function hideSections(){

[
"searchSection",
"detailSection",
"librarySection",
"wishlistSection",
"upcomingSection",
"statsSection"
]
.forEach(id=>{
document
.getElementById(id)
.classList.add("hidden");
});

[
"tabSearch",
"tabLibrary",
"tabWishlist",
"tabUpcoming",
"tabStats"
]
.forEach(id=>{
document
.getElementById(id)
.classList.remove("active");
});

}


function showSearch(){

hideSections();

document
.getElementById("searchSection")
.classList.remove("hidden");

document
.getElementById("tabSearch")
.classList.add("active");

}


function showLibrary(){

hideSections();

document
.getElementById("librarySection")
.classList.remove("hidden");

document
.getElementById("tabLibrary")
.classList.add("active");

renderLibrary();

}



function showWishlist(){

hideSections();

document
.getElementById("wishlistSection")
.classList.remove("hidden");

document
.getElementById("tabWishlist")
.classList.add("active");

renderWishlist();

}


function showUpcoming(){

hideSections();

document
.getElementById("upcomingSection")
.classList.remove("hidden");

document
.getElementById("tabUpcoming")
.classList.add("active");

loadUpcoming();

}


function showStats(){

hideSections();

document
.getElementById("statsSection")
.classList.remove("hidden");

document
.getElementById("tabStats")
.classList.add("active");

renderStats();

}


/* =========================
   UTILITAIRES
========================= */

function stripHtml(html){

const div =
document.createElement("div");

div.innerHTML =
html || "";

return div.textContent ||
div.innerText ||
"";

}


function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text == null
?
""
:
String(text);

return div.innerHTML;

}

document
.getElementById("searchInput")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter")
searchGames();

}
);
